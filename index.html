<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비담농장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2E6A4E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="비담농장">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* Layout: 휴대폰 한 화면 앱. 상단 헤더 · 가운데 스크롤 본문 · 하단 고정 탭 5개 · 입력은 아래에서 올라오는 시트 */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#18211C; --muted:#5C6B62; --line:#D9E0DA;
  --accent:#2E6A4E; --accent-soft:#E2EEE6; --amber:#B7791F; --amber-soft:#FBF0DC;
  --red:#B4423A; --red-soft:#F8E3E0; --blue:#3A6EA5; --blue-soft:#E3ECF6; --grid:#E3E8E4; --scrim:rgba(16,22,19,.45);
  --display:"Gothic A1","IBM Plex Sans KR","Noto Sans Thai","Noto Sans Khmer","Noto Sans Devanagari",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Noto Sans Thai","Noto Sans Khmer","Noto Sans Devanagari",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --ink:#E6ECE8; --muted:#9AA9A0; --line:#2C3832;
  --accent:#6BB892; --accent-soft:#1F3229; --amber:#E0A84A; --amber-soft:#33281A;
  --red:#E07C72; --red-soft:#3A2220; --blue:#7FAEE0; --blue-soft:#1C2836; --grid:#26302B; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --ink:#E6ECE8; --muted:#9AA9A0; --line:#2C3832;
  --accent:#6BB892; --accent-soft:#1F3229; --amber:#E0A84A; --amber-soft:#33281A;
  --red:#E07C72; --red-soft:#3A2220; --blue:#7FAEE0; --blue-soft:#1C2836; --grid:#26302B; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
header.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd h1{font-family:var(--display);font-weight:900;font-size:19px;margin:0}
.hd .date{font-size:12.5px;color:var(--muted)}
.who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.who i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
main{flex:1;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(86px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sec-t button{color:var(--accent);font-size:13px;font-weight:600}
.banner{display:flex;gap:10px;align-items:center;background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:14px;text-align:left;width:100%}
.banner b{color:var(--red);white-space:nowrap;flex:none}
.banner.info{background:var(--blue-soft)}
.banner.info b{color:var(--blue)}

/* quick grid */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 4px 10px;display:grid;justify-items:center;gap:6px;font-weight:700;font-size:14px;position:relative;min-height:84px}
.qbtn .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--surface);font-family:var(--display);font-size:15px;font-weight:900}
.qbtn .cnt{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent)}
.qbtn.miss{border-color:var(--red)}
.qbtn.miss .cnt{color:var(--red)}
.qbtn.zero .cnt{color:var(--blue)}
.qbtn:active{transform:scale(.97)}

/* todo */
.todo{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center}
.todo .bar{align-self:stretch;border-radius:3px}
.todo b{display:block;font-size:14.5px}
.todo small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .n{font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.todo>span:nth-child(2){min-width:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.chip.wrap{flex:initial}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}

/* sow cards */
.sow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.sow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sow-no{font-family:var(--mono);font-weight:600;font-size:16px}
.sow-meta{font-size:12.5px;color:var(--muted)}
.stage{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st-후보{background:var(--grid);color:var(--muted)}
.st-이유{background:var(--amber-soft);color:var(--amber)}
.st-교배{background:var(--blue-soft);color:var(--blue)}
.st-임신{background:var(--accent-soft);color:var(--accent)}
.st-포유{background:var(--amber-soft);color:var(--amber)}
.st-재교배{background:var(--red-soft);color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border-radius:9px;padding:3px}
.seg button{font-size:12.5px;padding:7px 2px;border-radius:7px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.dd{font-family:var(--mono);font-size:12.5px;font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.act.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.act.bad{border-color:var(--red);color:var(--red)}
.act.warn{border-color:var(--amber);color:var(--amber)}
input[type=search],input[type=text],input[type=number],input[type=date],textarea,select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:80px;resize:vertical}

/* timeline */
.tl-day{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:30px 1fr;gap:10px;text-align:left;width:100%}
.ev .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--surface);font-family:var(--display);font-size:14px;font-weight:900}
.ev .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ev .txt{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.tag.late{background:var(--amber-soft);color:var(--amber)}
.tag.zero{background:var(--blue-soft);color:var(--blue)}
.ev .del{grid-column:2;display:flex;gap:6px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:1px}
.tile .lab{font-size:12.5px;color:var(--muted)}
.tile .val{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .val small{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.tile .sub{font-size:11.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{font-size:14px;margin:0 0 8px}
.card svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
svg .vt{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.note{font-size:12px;color:var(--muted)}

/* close */
.cl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cl.miss{border-color:var(--red);background:var(--red-soft)}
.cl b{font-size:15px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--accent-soft);color:var(--accent)}
.p-zero{background:var(--blue-soft);color:var(--blue)}
.p-miss{background:var(--red);color:var(--surface)}
.cl .btns{display:flex;gap:6px;align-items:center}
.datebar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.datebar button{width:40px;height:36px;border-radius:8px;font-size:18px;font-weight:700;color:var(--accent)}
.datebar b{font-size:15px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;position:relative}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:var(--surface);font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sh-hd{background:var(--surface);padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sh-hd h2{font-family:var(--display);font-weight:800;font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
.sh-hd .x{font-size:15px;color:var(--muted);padding:6px 4px}
.sh-bd>*{flex-shrink:0}
.sh-bd{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sh-ft{background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.f{display:grid;gap:6px}
.f>label,.f>.lb{font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.f .hint{font-weight:500;color:var(--amber)}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.stepper button{height:50px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:26px;font-weight:700}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input{-moz-appearance:textfield;text-align:center;font-family:var(--display);font-weight:800;font-size:24px;height:50px;padding:4px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;font-size:14px}
.calc b{font-family:var(--display);font-size:18px}
.sowpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:210px;overflow-y:auto}
.sowpick button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center;display:grid;gap:1px}
.sowpick button b{font-family:var(--mono);font-size:15px}
.sowpick button small{font-size:11px;color:var(--muted)}
.sowpick button.on{border-color:var(--accent);background:var(--accent-soft)}
.save{background:var(--accent);color:var(--surface);font-weight:800;font-size:17px;border-radius:12px;padding:14px}
.save:disabled{opacity:.45}
.warnbox{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:14px;display:grid;gap:8px}
.warnbox b{color:var(--amber)}
.late-note{font-size:12.5px;color:var(--amber);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* 모돈 상세 */
button.sow-no{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
button.sow-no .chev{font-family:var(--body);font-size:15px;line-height:1}
.mini-link{color:var(--accent);font-weight:700;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:1px;text-align:center}
.kv small{font-size:11.5px;color:var(--muted)}
.kv b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.sched{display:grid;gap:6px}
.sched div{display:flex;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.sched span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.dtbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.dtbl table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px}
.dtbl th,.dtbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dtbl th:first-child,.dtbl td:first-child{text-align:left}
.dtbl th{font-size:11.5px;color:var(--muted);font-weight:600}
.dtbl tr:last-child td{border-bottom:0}
.hist{display:grid;gap:6px}
.hist .ev{grid-template-columns:26px 1fr;padding:8px 10px}
.hist .ev .ic{width:26px;height:26px;font-size:12px}
.homegrid{display:grid;gap:12px}
.homegrid>div{display:grid;gap:12px;align-content:start;min-width:0}
.sowgrid,.chartgrid{display:grid;gap:12px}

/* 태블릿 */
@media (min-width:720px){
  .app{max-width:920px}
  nav.tabs .in{max-width:920px}
  .homegrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
  .sowgrid,.chartgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  main.v-tl,main.v-close{max-width:720px;width:100%;margin:0 auto}
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:18px;max-height:88%;max-width:600px}
  .sheet.wide{max-width:760px}
  .sh-ft{padding-bottom:12px}
  .qbtn{min-height:96px;font-size:15px}
}
/* 데스크톱: 왼쪽 세로 메뉴 */
@media (min-width:1024px){
  nav.tabs{top:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 8px 16px max(8px,env(safe-area-inset-left,0px))}
  nav.tabs .in{grid-template-columns:1fr;gap:6px;max-width:none;margin:0}
  nav.tabs button{padding:12px 0;border-radius:12px;font-size:12.5px}
  nav.tabs button.on{background:var(--accent-soft)}
  .app{max-width:none;margin-left:96px}
  header.hd{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  main{padding:20px max(32px,env(safe-area-inset-right,0px)) 40px max(32px,env(safe-area-inset-left,0px));max-width:1240px;width:100%;margin:0 auto}
  main.v-tl,main.v-close{max-width:780px}
  .sowgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .toast{bottom:32px;left:calc(50% + 48px)}
}
.tdck{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.ckbox{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;cursor:pointer;min-height:32px}
.ckbox input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.sow.done{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.sow.done .ckbox span{color:var(--accent)}
.prog{font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.todo.alldone{opacity:.7}
.todo .n small{font-size:12px;color:var(--muted);font-weight:700;margin-left:1px}
.proto{font-size:12px;color:var(--muted);text-align:center;padding:4px 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px)}to{transform:none}}}

/* ===== 2차 시제품 추가 스타일 ===== */
nav.tabs .in.d{display:none}
@media (min-width:1024px){
  nav.tabs .in.m{display:none}
  nav.tabs .in.d{display:grid;grid-template-columns:1fr;gap:4px}
  nav.tabs{overflow-y:auto}
  nav.tabs .in.d button{padding:9px 0}

input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:center;min-width:0}
.row2 input[type=date],.row2 input[type=time]{flex:1;width:auto}
.ic.tile{padding:0;overflow:hidden}.ic.tile svg{width:100%;height:100%}
.ic.tile img{width:100%;height:100%;display:block;object-fit:cover}.ic.tile{border-radius:9px}
.qbtn .ic.tile,.qgrid .qbtn .ic.tile{width:46px;height:46px;border-radius:11px}
</style>
</head>

function stalls(){
  const T=state.cfgSt||CFG.st,out=[];
  activeSows().forEach(s=>{
    const i=statusOf(s),d=i.d;const push=(why,sev="warn")=>out.push({kind:"stall",s,i,why,sev});
    if(i.stage==="이유"&&d>=T.weanNoMate)push(`이유 후 ${d}일째 교배 기록 없음`,"bad");
    if(i.stage==="이유"&&d>=7&&s.loc==="분만사")push(`이유 후 ${d}일째 위치가 분만사 (이동 기록 없음)`);
    if(i.stage==="포유"&&!weanSkip(s)&&d>=T.farrowNoWean)push(`분만 후 ${d}일째 이유 기록 없음`,"bad");
    if(i.stage==="포유"&&s.loc!=="분만사")push(`포유 중인데 위치가 ${s.loc}`);
    if(i.stage==="교배"&&d>=T.mateNoCheck)push(`교배 후 ${d}일째 임신 확인 없음`,"bad");
    if(i.stage==="임신"&&d>=T.gestOver)push(`교배 후 ${d}일째 분만 기록 없음`,"bad");
    if(i.stage==="임신"&&CFG.gest-d<=3&&s.loc!=="분만사")push(`분만 ${Math.max(CFG.gest-d,0)}일 전인데 위치가 ${s.loc}`);

function candidates(){
  const I=ui.in,F=FORMS[I.type];if(!F.sow)return [];
  const today=state.records.filter(r=>r.type===I.type&&r.workDate===I.date&&r.data.sow);
  const doneIds=new Set(today.map(r=>r.data.sow));
  const list=[];
  state.sows.forEach(s=>{if(culledRec(s.id))return;
    EXCL=null;const i=statusOf(s);
    const inTarget=doneIds.has(s.id)?true:F.sow.filter(i,I.date);
    const q=I.q.trim().toLowerCase();
    const show=q?s.id.toLowerCase().includes(q):(I.all||inTarget||I.sel.includes(s.id));
    if(show)list.push({s,i,done:doneIds.has(s.id),target:inTarget});
  });
  const pr=x=>x.done?2:x.target?0:1;
  list.sort((a,b)=>pr(a)-pr(b)||b.i.d-a.i.d||a.s.id.localeCompare(b.s.id));
  const targetN=state.sows.filter(s=>!culledRec(s.id)&&(doneIds.has(s.id)||F.sow.filter(statusOf(s),I.date))).length;
  return {list,targetN,doneN:doneIds.size};
}
function doSave(force){
  const I=ui.in,F=FORMS[I.type];I.err=null;
  const d={...I.fv};F.f.forEach(f=>{if(f.t==="step")d[f.k]=Number(d[f.k])||0;if(f.t==="text")d[f.k]=String(d[f.k]||"").trim()});
  if(F.err){const e=F.err(d);if(e&&!I.editId){I.err=e;render();return}}
  const sows=F.sow?I.sel:[null];
  EXCL=I.editId;
  if(!force&&F.warn){const ws=sows.map(s=>F.warn(d,I.date,s)).filter(Boolean);if(ws.length){I.warn=ws;EXCL=null;render();return}}
  const ids=[];let msg="";
  sows.forEach(s=>{
    const dd={...d};if(F.pre)F.pre(dd,I.date,s);
    const data={};F.f.forEach(f=>{if(f.t!=="calc"&&dd[f.k]!==undefined&&dd[f.k]!=="")data[f.k]=dd[f.k]});
    if(I.type==="이유")data.days=dd.days;
    if(dd.prod)data.prod=dd.prod;
    if(s)data.sow=s;
    if(I.type==="도입"){data.sow=data.sowid;delete data.sowid;}
    if(I.editId){const r=state.records.find(x=>x.id===I.editId);if(r){if(r.data.decision)data.decision=r.data.decision;r.workDate=I.date;r.data=data;r.edited=true;r.editedAt=new Date().toISOString();r.editedBy=state.user;ids.push(r.id)}}
    else{
      if(I.type==="임신확인"&&data.result==="임신"){const sw=state.sows.find(x=>x.id===s);if(sw&&sw.gilt&&!sowState(s).pregEver)msg+=` · ${s} 모돈 편입`}
      const rec=addRecord(I.type,I.date,data);ids.push(rec.id);
      if(I.type==="도입")state.sows.push({id:data.sow,baseParity:0,loc:SOW_LOCS[0],gilt:true,breed:data.breed,intro:I.date});
    }
  });
  EXCL=null;save();
  const n=ids.length;
  let m=I.editId?"수정했습니다":`${L(I.type)} ${n>1?n+"두 ":""}저장했습니다`;
  if(!I.editId&&I.type==="교배")m+=` · 재발 확인 ${kDate(addDays(I.date,21))}, 분만 예정 ${kDate(addDays(I.date,CFG.gest))}`;
  if(I.date<TODAY)m+=" (지연 입력)";
  m+=msg;
  I.flash=ids;I.warn=null;
  if(F.sow){I.sel=[];}
  if(I.editId){I.editId=null;I.fv=defaults(I.type)}
  else{ // 연속 입력: 선택값은 유지, 숫자는 기본값으로
    F.f.forEach(f=>{if(f.t==="step"&&!["kg"].includes(f.k))I.fv[f.k]=f.def;if((f.t==="text"||f.t==="textarea"||f.t==="date")&&f.k!=="kind")I.fv[f.k]="";});
    if(I.type==="폐사")ui.dec=null;
  }
  render();toast(m);
  const el=document.getElementById("r-"+ids[0]);if(el&&window.innerWidth<720)el.scrollIntoView({block:"center",behavior:"smooth"});
  setTimeout(()=>{if(ui.in){ui.in.flash=[];document.querySelectorAll(".srow.flash").forEach(e=>e.classList.remove("flash"))}},4000);
}

const LOSS=FARM.stageLoss;
function isoWeek(s){const t=new Date(toUTC(s));const d=(t.getUTCDay()+6)%7;const th=new Date(t.getTime()+(3-d)*864e5);const y=th.getUTCFullYear();const j=Date.UTC(y,0,1);return {y,w:1+Math.floor((th.getTime()-j)/(7*864e5))}}
function weekStart(s){const t=new Date(toUTC(s));const wd=(t.getUTCDay()+6)%7;return addDays(s,-wd)}
function bName(k){const i=isoWeek(k),c=isoWeek(TODAY);return `${i.y!==c.y?String(i.y).slice(2)+"-":""}W${i.w} 분만군`}
function bAgo(k){const n=Math.round(diff(k,weekStart(TODAY))/7);return n<=0?t("이번 주"):n+(LANG==="ko"?"":" ")+t("주 전")}
const shipAge=()=>state.cfg.stage.reduce((s,x)=>s+x[1],0);
const bAge=b=>Math.floor(diff(b.k,REF)/7);
function stagePlan(ageW){let a=0;for(const [n,w] of state.cfg.stage){a+=w;if(ageW<a)return n}return "출하"}
function bHeads(b,ageW){let n=b.live,a=ageW;state.cfg.stage.forEach(([nm,len],i)=>{if(a<=0)return;n*=1-LOSS[i]*Math.min(a,len)/len;a-=len});return Math.round(n)}
function bVax(b,p){const due=addDays(b.k,p.day),need=bHeads(b,Math.floor(p.day/7)),recs=state.records.filter(r=>r.type==="돈군백신"&&r.data.batch===b.k&&r.data.vax===p.name),done=recs.reduce((s,r)=>s+r.data.n,0);
  const over=REF>addDays(due,6);
  const st=done>=need*.98?"done":done>0?(over?"part":"partnow"):over?"late":REF>=due?"due":diff(REF,due)<=7?"soon":"plan";
  return {p,due,need,done,recs,st}}
const liveBatches=()=>batches().filter(b=>bAge(b)>=0&&bAge(b)<shipAge()&&(!state.batchCut||b.k>=state.batchCut));
const VST={done:["done","완료"],part:["late","일부 · 기한 지남"],partnow:["part","일부 접종"],late:["late","누락"],due:["due","이번 주"],soon:["soon","다음 주"],plan:["","예정"]};

const CATS=["항생제","사료첨가제","소독제","비품","백신","정액","기타"];

const itemById=id=>state.items.find(i=>i.id===id);
const itemId=name=>(state.items.find(i=>i.name===name)||{}).id;
function stockRecs(it){return state.records.filter(r=>(r.type==="재고"&&r.data.item===it.id)||(r.type==="돈군백신"&&[].concat(r.data.prod).includes(it.name))||(r.type==="백신"&&vaxProds(r.data.name).includes(it.name))||(r.type==="교배"&&r.data.semen===it.name)||(r.type==="약품"&&r.data.name===it.name))}
function delta(r){if(r.type==="재고")return r.data.mode==="입고"?r.data.qty:r.data.mode==="사용"?-r.data.qty:0;if(r.type==="돈군백신")return -r.data.n;if(r.type==="약품")return -(r.data.qty||1);return -1}
function semenOrder(){
  const tmr=addDays(TODAY,1);let n=0;
  activeSows().forEach(s=>{const i=statusOf(s);if(i.stage==="이유"){const d=diff(i.since,tmr);if(d>=4&&d<=7)n++}else if(i.stage==="재교배")n++});
  const doses=n*state.cfg.semenPerSow,stock=state.items.filter(x=>x.cat==="정액"&&!x.hidden).reduce((s,x)=>s+(stockOf(x).qty||0),0);
  return {n,doses,stock,order:Math.max(0,doses-stock)};
}

function semenClock(){const n=new Date(),hm=pad(n.getHours())+":"+pad(n.getMinutes()),S=FARM.semen;
  return hm>=S.deadline?{sev:"bad",txt:`${S.deadline} 마감 지남`}:hm>=S.alerts[1]?{sev:"bad",txt:`${S.deadline} 마감 임박`}:hm>=S.alerts[0]?{sev:"warn",txt:`${S.deadline}까지 주문`}:{sev:"ok",txt:`${S.deadline}까지 주문`}}

  const low=state.items.filter(it=>!it.hidden).map(it=>({it,s:stockOf(it)})).filter(x=>x.s.qty!==null&&x.s.qty<x.it.par).map(x=>({item:x.it,label:`재고 ${x.s.qty}${x.it.unit} / 적정 ${x.it.par}${x.it.unit}`,sev:"bad"}));
  const so=semenOrder();

    {k:"order",t:"정액 주문 (내일 교배 예정)",items:so.order>0?[{order:so,label:`${semenClock().txt} · 내일 교배 예정 ${so.n}두 × ${state.cfg.semenPerSow}${FARM.semen.unit} = ${so.doses}${FARM.semen.unit} · 재고 ${so.stock}${FARM.semen.unit} → ${so.order}${FARM.semen.unit} 주문`,sev:semenClock().sev}]:[],act:null},
    {k:"stock",t:"재고 부족",items:low,act:"stock"},...vaxTodos(),...feedTodos(),...amTodos()
  ];
}

  const asc=state.records.filter(r=>r.data&&r.data.sow===id).sort((a,b)=>a.workDate.localeCompare(b.workDate));
  const far=asc.filter(r=>r.type==="분만"),s=state.sows.find(x=>x.id===id);
  return far.map((f,n)=>{const nextF=far[n+1];
    const m=[...asc].reverse().find(r=>r.type==="교배"&&r.data.round==="1차"&&r.workDate<f.workDate&&diff(r.workDate,f.workDate)<=125);
    const w=asc.find(r=>r.type==="이유"&&r.workDate>f.workDate&&(!nextF||r.workDate<nextF.workDate));
    const nm=w?asc.find(r=>r.type==="교배"&&r.workDate>w.workDate&&(!nextF||r.workDate<nextF.workDate)):null;

const feedKinds=()=>[...FARM.feed.bins.map(b=>b.feed),...FARM.feed.bags.map(b=>b.feed)];

function pigFeeds(day){return FARM.feed.piglet.filter(p=>day>=p.from&&day<p.to)}
// 지금 하루 사용량(kg) 추정
function feedUse(){const u={},U=FARM.feed.use,add=(f,n)=>u[f]=(u[f]||0)+n;
  activeSows().forEach(s=>{const i=statusOf(s);add(i.stage==="포유"?"포유모돈":"임신모돈",i.stage==="포유"?U.포유모돈:U.임신모돈)});
  liveBatches().forEach(b=>{const d=diff(b.k,REF),n=bHeads(b,Math.floor(d/7));pigFeeds(d).forEach(p=>add(p.feed,n*(U[p.feed]||0)))});
  return u}
// 재고 = 마지막 잔량 + 이후 입고 − 추정 사용
function feedStock(f,use){const rs=state.records.filter(r=>r.type==="사료"&&r.data.kind===f).sort((a,b)=>a.workDate.localeCompare(b.workDate));
  const base=[...rs].reverse().find(r=>r.data.mode==="빈 잔량"||r.data.mode==="잔량");if(!base)return {kg:null,use,days:null};
  const inn=rs.filter(r=>r.data.mode==="입고"&&r.workDate>base.workDate&&r.workDate<=REF).reduce((s,r)=>s+r.data.kg,0);
  const kg=Math.max(0,Math.round(base.data.kg+inn-use*diff(base.workDate,REF)));

  const miss=L.find(b=>bAge(b)>=8&&bAge(b)<10),part=L.find(b=>bAge(b)>=11&&bAge(b)<13);
  L.forEach(b=>state.cfg.prog.forEach((p,pi)=>{const due=addDays(b.k,p.day);if(due>addDays(TODAY,-7))return;
    if(b===miss&&pi===1)return;let n=bVax(b,p).need;if(b===part&&pi===2)n=Math.round(n*.7);
    const wd=addDays(due,2);state.records.push({id:newId(),type:"돈군백신",workDate:wd,createdAt:new Date(toUTC(wd)+9*36e5).toISOString(),user:W[k++%3],data:{batch:b.k,vax:p.name,prod:p.prod,n}})}));
  const qty={i1:14,i2:3,i3:80,i4:55,i5:7,i6:900,i7:1400,i8:420,i9:70,i10:75,i11:3};const d2=addDays(TODAY,-2);
  state.items.forEach(it=>state.records.push({id:newId(),type:"재고",workDate:d2,createdAt:new Date(toUTC(d2)+8*36e5).toISOString(),user:"김OO",data:{item:it.id,mode:"실사",qty:qty[it.id]}}));
}
const boardDate=()=>ui.boardDay||(new Date().getHours()>=18?addDays(TODAY,1):TODAY);

  editRec:v=>{const r=state.records.find(x=>x.id===v);if(!r)return;openInput(r.type,{date:r.workDate});A.edit(v)},
  peOpen:()=>{const s=state.sows.find(x=>x.id===ui.sowId);ui.pe={breed:s.breed||"LYD",bp:s.baseParity,intro:s.intro||"",memo:s.memo||""};render()},
  peBreed:v=>{peKeep();ui.pe.breed=v;render()},

  stMode:v=>{ui.st.mode=v;if(v!=="기간"&&ui.st.cmp==="none")ui.st.cmp="prev";render()},
  stNav:v=>{const S=ui.st,n=Number(v);
    if(S.mode==="월"){let [y,m]=S.ym.split("-").map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}const ym=`${y}-${pad(m)}`;if(ym<=TODAY.slice(0,7))S.ym=ym}
    if(S.mode==="분기"){let [y,q]=S.yq.split("-").map(Number);q+=n;if(q<1){q=4;y--}if(q>4){q=1;y++}if(monthRange(y,q*3-2)[0]<=TODAY)S.yq=`${y}-${q}`}
    render()},
  stYr:v=>{ui.st.yr=v;render()},
  stCmp:v=>{ui.st.cmp=v;render()},
  stQuick:v=>{const S=ui.st,y=+TODAY.slice(0,4);if(v==="4w"){S.from=addDays(TODAY,-27);S.to=TODAY}if(v==="3m"){S.from=addDays(TODAY,-90);S.to=TODAY}if(v==="ty"){S.from=`${y}-01-01`;S.to=TODAY}if(v==="ly"){S.from=`${y-1}-01-01`;S.to=`${y-1}-12-31`}render()},
  stMetric:v=>{ui.st.metric=v;render()},
  yyNav:v=>{const y=ui.st.yy+Number(v);if(y<=+TODAY.slice(0,4))ui.st.yy=y;render()},
  pyOpen:()=>{ui.pyf={ym:`${+TODAY.slice(0,4)-1}-01`};render()},
  pyClose:()=>{ui.pyf=null;render()},
  pySave:()=>{const o={};document.querySelectorAll("[data-py]").forEach(e=>{if(e.value!=="")o[e.dataset.py]=+e.value});state.prevYear=state.prevYear||{};state.prevYear[ui.pyf.ym]=o;save();render();toast(`${ui.pyf.ym} 성적을 저장했습니다`)},
  bDay:v=>{ui.boardDay=v==="tmr"?addDays(TODAY,1):TODAY;ui.memoEdit=false;render()},
  tvMode:()=>{const on=document.body.classList.toggle("tv");
    try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
    try{if(on&&navigator.wakeLock)navigator.wakeLock.request("screen").then(l=>ui.wl=l).catch(()=>{});else if(ui.wl){ui.wl.release();ui.wl=null}}catch(e){}

  drugCat:v=>{ui.drugCat=v;render()},
  itemEdit:v=>{ui.itemEdit=v||null;render()},
  parStep:(v,el)=>{const it=itemById(el.dataset.k);it.par=Math.max(0,it.par+Number(v)*(it.par>=100?50:it.par>=20?5:1));save();render()},
  wdStep:(v,el)=>{const it=itemById(el.dataset.k);it.withdraw=Math.max(0,(it.withdraw||0)+Number(v));save();render()},

  niCat:v=>{const n=$("#niName"),u=$("#niUnit");ui.newItem.name=n?n.value:"";ui.newItem.unit=u?u.value:ui.newItem.unit;ui.newItem.cat=v;render()},
  niCancel:()=>{ui.newItem=null;render()},
  niSave:()=>{const name=$("#niName").value.trim();if(!name){toast("품목 이름을 입력하세요");return}if(state.items.some(i=>i.name===name&&!i.hidden)){toast("이미 있는 품목입니다");return}

});

function statusOf(s){
  const st=sowState(s.id),c=culledRec(s.id),parity=s.baseParity+st.farrows;
  const gilt=!!s.gilt&&!st.pregEver;
  if(c)return {...st,parity,gilt:false,key:"도태됨",label:t("도태됨"),sub:`${kDate(c.workDate)} · ${c.data.reason}`,cls:"x",heat:false,d:0};
  let key,label,sub,cls,heat=false,d=0;
  if(st.stage==="후보"){d=s.intro?diff(s.intro,REF):0;key="후보";label=t("후보돈");sub=s.intro?`${t("도입")} ${d}${t("일")}`:"-";cls="c-gilt"}
  else if(st.stage==="이유"){d=diff(st.since,REF);key="발정대기";label=t("발정 대기");sub=`${t("이유")} D+${d}`;heat=d>=3&&d<=7;cls="c-wean"}
  else if(st.stage==="교배"){d=diff(st.mate,REF);key="확인전";label=t("교배 · 확인 전");sub=`${t("교배")} D+${d}`;heat=d>=18&&d<=24;cls="c-mate"}
  else if(st.stage==="임신"){d=diff(st.mate,REF);const left=CFG.gest-d;
    if(left<=CFG.farrowIn){key="분만임박";label=t("분만 임박");sub=left>0?`${t("분만")} D−${left}`:left===0?t("오늘 분만 예정"):`${t("분만")} +${-left}${t("일 지남")}`;cls="c-due"}
    else{key="임신";label=t("임신");sub=`${t("임신")} ${d}${t("일")}`;cls="c-preg"}}
  else if(st.stage==="포유"){d=diff(st.farrow,REF);key="포유";label=t(s.nurse?"대리모":"포유");sub=s.nurse?`${t("대리모")} ${diff(s.nurse.since,REF)}${t("일")}`:`${t("포유")} ${d}${t("일")} · ${t("실산")} ${st.live}`;cls="c-lac";
    if(s.weanHold&&s.weanHold.until>=REF)sub+=` · ${t("이유 보류")} ~${kDate(s.weanHold.until)}`}
  else {d=diff(st.since,REF);key="재발공태";label=t(st.lastResult||"재발");sub=`${t(st.lastResult)} D+${d} · ${t("재교배 대기")}`;heat=true;cls="c-ret"}
  return {...st,parity,gilt,key,label,sub,cls,heat,d,plan:s.cullPlan};
}

  case "이유":return `${d.sow} ${t("이유")} ${d.n}${t("두")} · ${d.days}${t("일")}`;

function deadPending(){
  const C=state.cfg,out=[];
  const recs=state.records.filter(r=>r.type==="폐사"&&diff(r.workDate,TODAY)<=7);
  recs.forEach(r=>{if(r.data.n>=C.deadOne&&!r.data.decision)out.push({r,pending:true,label:`${kDate(r.workDate)} · ${summary(r)}`,sev:"bad"})});
  const g={};recs.forEach(r=>{const k=r.workDate+"|"+r.data.barn;(g[k]=g[k]||[]).push(r)});
  Object.entries(g).forEach(([k,rs])=>{const day=dayGroup(k,rs);if(day.pending)out.push({day,pending:true,label:`${kDate(day.date)} · ${day.barn} ${t("하루 합계")} ${day.total}${t("두")} (${rs.length}${t("건")})`,sev:"bad"})});
  return out;
}
function dayGroup(k,rs){
  const C=state.cfg,[date,...b]=k.split("|"),barn=b.join("|"),total=rs.reduce((s,r)=>s+r.data.n,0);
  const bigOpen=rs.some(r=>r.data.n>=C.deadOne&&!r.data.decision);
  const dd=(state.dayDec||{})[k];
  const covered=Math.max(dd?dd.total:0,rs.filter(r=>r.data.n>=C.deadOne&&r.data.decision).reduce((s,r)=>s+r.data.n,0));
  return {k,date,barn,total,cnt:rs.length,rs,dd,pending:total>=C.deadDay&&!bigOpen&&total>covered};
}

function survF(age){let f=1,a=age;state.cfg.stage.forEach(([n,len],i)=>{if(a<=0)return;f*=1-LOSS[i]*Math.min(a,len)/len;a-=len});return f}
function batches(){const g={};state.records.filter(r=>r.type==="분만").forEach(f=>{const k=weekStart(f.workDate);(g[k]=g[k]||{k,f:[]}).f.push(f)});
  const out=Object.values(g).map(b=>({...b,live:b.f.reduce((s,f)=>s+f.data.live,0)}));
  (state.mbatches||[]).forEach(m=>{const live=Math.round(m.n/survF(m.age));const ex=out.find(b=>b.k===m.k);if(ex){ex.live=live;ex.fixed=m.n}else out.push({k:m.k,f:[],live,manual:true,litters:m.litters||0,n0:m.n})});
  return out.sort((a,b)=>b.k.localeCompare(a.k))}
function stockOf(it){
  const rs=stockRecs(it).sort((a,b)=>a.workDate.localeCompare(b.workDate)||a.createdAt.localeCompare(b.createdAt));
  if(!rs.some(r=>r.type==="재고"))return {qty:null,avg:0,days:null};
  let q=0,used=0;const from=addDays(TODAY,-27);
  rs.forEach(r=>{if(r.type==="재고"&&r.data.mode==="실사"){q=r.data.qty;return}const d=delta(r);q+=d;if(d<0&&r.workDate>=from)used-=d});
  const avg=used/28;return {qty:Math.round(q*10)/10,avg,days:avg>0?Math.floor(q/avg):null};
}

    migrateName(k,it.n,n);it.n=n;save();syncLists();toast(`이름을 ‘${n}’(으)로 바꿨습니다. 지난 기록도 바뀌었습니다.`)}
  if(x.dataset&&x.dataset.lab){const L3=state.labels[x.dataset.lab];const v=x.value.trim();if(v)L3[x.dataset.k]=v;else delete L3[x.dataset.k];save();renderTabs();toast("이름을 저장했습니다")}
});

});

/* ================= 입장 키 (링크를 받은 사람만) ================= */
const GATE="cbfad02f9ed2a8d1e08d8f74f5303e9eb93637d47f82ab6f1c15871cf8dd0481";
async function sha(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
async function gateOK(raw){
  try{if(localStorage.getItem("farm-gate")===GATE)return true}catch(e){}
  const src=raw!==undefined?raw:location.hash,m=String(src).match(/key=([A-Za-z0-9]+)/)||(raw!==undefined?String(raw).trim().match(/^([A-Za-z0-9]{4,})$/):null);
  if(m&&await sha(m[1])===GATE){try{localStorage.setItem("farm-gate",GATE)}catch(e){}if(location.hash)history.replaceState(null,"",location.pathname+location.search);return true}
  return false;
}
function renderGate(err){document.body.classList.add("login");
  $("#view").innerHTML=`<div class="login-box"><div class="login-brand"><img src="logo.png" alt="비담농장" class="login-logo"></div><div class="panel"><b>농장에서 받은 링크로만 열 수 있습니다.</b><div class="sow-meta">대표님께 받은 링크를 다시 눌러 주세요. 또는 대표님께 받은 입장 키를 아래에 입력하세요.</div><input type="text" id="gateIn" placeholder="입장 키 또는 받은 링크" inputmode="numeric" aria-label="받은 링크 또는 입장 키">${err?`<div class="errbox">입장 키가 맞지 않습니다.</div>`:""}<button class="save" type="button" id="gateBtn">열기</button></div></div>`;
  $("#gateBtn").onclick=async()=>{if(await gateOK($("#gateIn").value)){render()}else renderGate(true)}}

state=load();
if(!state||state.v!==7){makeState("farm")}
try{ME=localStorage.getItem(SKEY)}catch(e){}
{const ad=(state.accounts||[]).find(a=>a.id==="a1");if(ad&&ad.pin==="0000"){ad.pin="9368";save()}}
syncLists();
state.cfgSt=state.cfgSt||{...CFG.st};state.tasks=state.tasks||[];state.todoLog=state.todoLog||{};
gateOK().then(ok=>ok?render():renderGate());
window.addEventListener("hashchange",()=>{if(/key=/.test(location.hash))gateOK().then(ok=>ok?render():renderGate(true))});

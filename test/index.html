<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비담농장 (테스트)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2E6A4E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+Khmer:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="비담 테스트">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}
/* Layout: 휴대폰 한 화면 앱. 상단 헤더 · 가운데 스크롤 본문 · 하단 고정 탭 5개 · 입력은 아래에서 올라오는 시트 */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#18211C; --muted:#5C6B62; --line:#D9E0DA;
  --accent:#2E6A4E; --accent-soft:#E2EEE6; --amber:#B7791F; --amber-soft:#FBF0DC;
  --red:#B4423A; --red-soft:#F8E3E0; --blue:#3A6EA5; --blue-soft:#E3ECF6; --grid:#E3E8E4; --scrim:rgba(16,22,19,.45);
  --display:"Gothic A1","IBM Plex Sans KR","Noto Sans Thai","Noto Sans Khmer","Noto Sans Devanagari",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Noto Sans Thai","Noto Sans Khmer","Noto Sans Devanagari",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --ink:#E6ECE8; --muted:#9AA9A0; --line:#2C3832;
  --accent:#6BB892; --accent-soft:#1F3229; --amber:#E0A84A; --amber-soft:#33281A;
  --red:#E07C72; --red-soft:#3A2220; --blue:#7FAEE0; --blue-soft:#1C2836; --grid:#26302B; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --ink:#E6ECE8; --muted:#9AA9A0; --line:#2C3832;
  --accent:#6BB892; --accent-soft:#1F3229; --amber:#E0A84A; --amber-soft:#33281A;
  --red:#E07C72; --red-soft:#3A2220; --blue:#7FAEE0; --blue-soft:#1C2836; --grid:#26302B; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
header.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd h1{font-family:var(--display);font-weight:900;font-size:19px;margin:0}
.hd .date{font-size:12.5px;color:var(--muted)}
.who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.who i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
main{flex:1;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(86px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sec-t button{color:var(--accent);font-size:13px;font-weight:600}
.banner{display:flex;gap:10px;align-items:center;background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:14px;text-align:left;width:100%}
.banner b{color:var(--red);white-space:nowrap;flex:none}
.banner.info{background:var(--blue-soft)}
.banner.info b{color:var(--blue)}

/* quick grid */
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 4px 10px;display:grid;justify-items:center;gap:6px;font-weight:700;font-size:14px;position:relative;min-height:84px}
.qbtn .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--surface);font-family:var(--display);font-size:15px;font-weight:900}
.qbtn .cnt{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent)}
.qbtn.miss{border-color:var(--red)}
.qbtn.miss .cnt{color:var(--red)}
.qbtn.zero .cnt{color:var(--blue)}
.qbtn:active{transform:scale(.97)}

/* todo */
.todo{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center}
.todo .bar{align-self:stretch;border-radius:3px}
.todo b{display:block;font-size:14.5px}
.todo small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .n{font-family:var(--display);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.todo>span:nth-child(2){min-width:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.chip.wrap{flex:initial}
.chipwrap{display:flex;flex-wrap:wrap;gap:6px}

/* sow cards */
.sow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.sow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sow-no{font-family:var(--mono);font-weight:600;font-size:16px}
.sow-meta{font-size:12.5px;color:var(--muted)}
.stage{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st-후보{background:var(--grid);color:var(--muted)}
.st-이유{background:var(--amber-soft);color:var(--amber)}
.st-교배{background:var(--blue-soft);color:var(--blue)}
.st-임신{background:var(--accent-soft);color:var(--accent)}
.st-포유{background:var(--amber-soft);color:var(--amber)}
.st-재교배{background:var(--red-soft);color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border-radius:9px;padding:3px}
.seg button{font-size:12.5px;padding:7px 2px;border-radius:7px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.dd{font-family:var(--mono);font-size:12.5px;font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.act{font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.act.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.act.bad{border-color:var(--red);color:var(--red)}
.act.warn{border-color:var(--amber);color:var(--amber)}
input[type=search],input[type=text],input[type=number],input[type=date],textarea,select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea{min-height:80px;resize:vertical}

/* timeline */
.tl-day{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:30px 1fr;gap:10px;text-align:left;width:100%}
.ev .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--surface);font-family:var(--display);font-size:14px;font-weight:900}
.ev .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ev .txt{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.tag.late{background:var(--amber-soft);color:var(--amber)}
.tag.zero{background:var(--blue-soft);color:var(--blue)}
.ev .del{grid-column:2;display:flex;gap:6px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:1px}
.tile .lab{font-size:12.5px;color:var(--muted)}
.tile .val{font-family:var(--display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .val small{font-size:12px;color:var(--muted);font-weight:600;margin-left:2px}
.tile .sub{font-size:11.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{font-size:14px;margin:0 0 8px}
.card svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
svg .vt{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.note{font-size:12px;color:var(--muted)}

/* close */
.cl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cl.miss{border-color:var(--red);background:var(--red-soft)}
.cl b{font-size:15px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--accent-soft);color:var(--accent)}
.p-zero{background:var(--blue-soft);color:var(--blue)}
.p-miss{background:var(--red);color:var(--surface)}
.cl .btns{display:flex;gap:6px;align-items:center}
.datebar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.datebar button{width:40px;height:36px;border-radius:8px;font-size:18px;font-weight:700;color:var(--accent)}
.datebar b{font-size:15px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0;position:relative}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--red);color:var(--surface);font-size:10px;font-weight:700;border-radius:999px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sh-hd{background:var(--surface);padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sh-hd h2{font-family:var(--display);font-weight:800;font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
.sh-hd .x{font-size:15px;color:var(--muted);padding:6px 4px}
.sh-bd>*{flex-shrink:0}
.sh-bd{overflow-y:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.sh-ft{background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.f{display:grid;gap:6px}
.f>label,.f>.lb{font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.f .hint{font-weight:500;color:var(--amber)}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.stepper button{height:50px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:26px;font-weight:700}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input{-moz-appearance:textfield;text-align:center;font-family:var(--display);font-weight:800;font-size:24px;height:50px;padding:4px}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;font-size:14px}
.calc b{font-family:var(--display);font-size:18px}
.sowpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:210px;overflow-y:auto}
.sowpick button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center;display:grid;gap:1px}
.sowpick button b{font-family:var(--mono);font-size:15px}
.sowpick button small{font-size:11px;color:var(--muted)}
.sowpick button.on{border-color:var(--accent);background:var(--accent-soft)}
.save{background:var(--accent);color:var(--surface);font-weight:800;font-size:17px;border-radius:12px;padding:14px}
.save:disabled{opacity:.45}
.warnbox{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:14px;display:grid;gap:8px}
.warnbox b{color:var(--amber)}
.late-note{font-size:12.5px;color:var(--amber);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* 모돈 상세 */
button.sow-no{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
button.sow-no .chev{font-family:var(--body);font-size:15px;line-height:1}
.mini-link{color:var(--accent);font-weight:700;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:1px;text-align:center}
.kv small{font-size:11.5px;color:var(--muted)}
.kv b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.sched{display:grid;gap:6px}
.sched div{display:flex;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.sched span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.dtbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.dtbl table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px}
.dtbl th,.dtbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dtbl th:first-child,.dtbl td:first-child{text-align:left}
.dtbl th{font-size:11.5px;color:var(--muted);font-weight:600}
.dtbl tr:last-child td{border-bottom:0}
.hist{display:grid;gap:6px}
.hist .ev{grid-template-columns:26px 1fr;padding:8px 10px}
.hist .ev .ic{width:26px;height:26px;font-size:12px}
.homegrid{display:grid;gap:12px}
.homegrid>div{display:grid;gap:12px;align-content:start;min-width:0}
.sowgrid,.chartgrid{display:grid;gap:12px}

/* 태블릿 */
@media (min-width:720px){:where(html:not([data-pc="off"])) .app{max-width:920px}
:where(html:not([data-pc="off"])) nav.tabs .in{max-width:920px}
:where(html:not([data-pc="off"])) .homegrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
:where(html:not([data-pc="off"])) .sowgrid,:where(html:not([data-pc="off"])) .chartgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
:where(html:not([data-pc="off"])) .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
:where(html:not([data-pc="off"])) main.v-tl,:where(html:not([data-pc="off"])) main.v-close{max-width:720px;width:100%;margin:0 auto}
:where(html:not([data-pc="off"])) .scrim{align-items:center;padding:24px}
:where(html:not([data-pc="off"])) .sheet{border-radius:18px;max-height:88%;max-width:600px}
:where(html:not([data-pc="off"])) .sheet.wide{max-width:760px}
:where(html:not([data-pc="off"])) .sh-ft{padding-bottom:12px}
:where(html:not([data-pc="off"])) .qbtn{min-height:96px;font-size:15px}}
:where(html[data-pc="on"]) .app{max-width:920px}
:where(html[data-pc="on"]) nav.tabs .in{max-width:920px}
:where(html[data-pc="on"]) .homegrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
:where(html[data-pc="on"]) .sowgrid,:where(html[data-pc="on"]) .chartgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
:where(html[data-pc="on"]) .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
:where(html[data-pc="on"]) main.v-tl,:where(html[data-pc="on"]) main.v-close{max-width:720px;width:100%;margin:0 auto}
:where(html[data-pc="on"]) .scrim{align-items:center;padding:24px}
:where(html[data-pc="on"]) .sheet{border-radius:18px;max-height:88%;max-width:600px}
:where(html[data-pc="on"]) .sheet.wide{max-width:760px}
:where(html[data-pc="on"]) .sh-ft{padding-bottom:12px}
:where(html[data-pc="on"]) .qbtn{min-height:96px;font-size:15px}

/* 데스크톱: 왼쪽 세로 메뉴 */
@media (min-width:1024px){:where(html:not([data-pc="off"])) nav.tabs{top:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 8px 16px max(8px,env(safe-area-inset-left,0px))}
:where(html:not([data-pc="off"])) nav.tabs .in{grid-template-columns:1fr;gap:6px;max-width:none;margin:0}
:where(html:not([data-pc="off"])) nav.tabs button{padding:12px 0;border-radius:12px;font-size:12.5px}
:where(html:not([data-pc="off"])) nav.tabs button.on{background:var(--accent-soft)}
:where(html:not([data-pc="off"])) .app{max-width:none;margin-left:96px}

.ic.tile{padding:0;overflow:hidden}.ic.tile svg{width:100%;height:100%}
.ic.tile img{width:100%;height:100%;display:block;object-fit:cover}.ic.tile{border-radius:9px}

.qbtn.pic{padding:0 0 9px;gap:7px;align-content:start}

.qgrid .qbtn.pic .ic.tile img{object-fit:contain}
.qbtn.pic .cnt{top:6px;right:6px;background:var(--surface);border-radius:10px;padding:1px 7px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.qbtn.pic .cnt:empty{display:none}
/* 입력 개수: 알림처럼 빨간 원 + 흰 숫자 (오늘 없음 0 은 파란 원) */
.qbtn.pic .cnt{top:-8px;right:-8px;min-width:30px;height:30px;padding:0 8px;border-radius:15px;display:grid;place-items:center;background:var(--red);color:#fff;font:800 24px/1 var(--mono);box-shadow:0 2px 5px rgba(0,0,0,.25);border:2px solid var(--surface);z-index:2}
.qbtn.pic.miss .cnt{color:#fff}
.qbtn.pic.zero .cnt{background:var(--blue);color:#fff}
/* 그림 위에 이름을 반투명 띠로 얹기 */
.qbtn.pic{padding:0;gap:0}
.qgrid .qbtn.pic .ic.tile{border-radius:10.5px}

/* ===== 성적 TV (16:9) ===== */
.stv{--bg:#0E1411;--surface:#17201B;--line:#2A3630;--ink:#EEF3EF;--muted:#9DB0A5;--grid:#24302A;--c-a:#3987e5;--c-b:#d95926;--good:#3DDC97;--red:#FF6B6B;--amber:#F6B84B;color-scheme:dark;background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:1.4vh}
body.tv .stv{position:fixed;inset:0;z-index:30;padding:1.6vh 1.4vw;height:100vh;overflow:hidden}

.stv-k small{font-size:1.6vh;color:var(--muted)}.stv-k b{font:900 4.4vh/1 var(--display);font-variant-numeric:tabular-nums}.stv-k b i{font-style:normal;font-size:1.7vh;color:var(--muted);margin-left:.2vw;font-weight:600}

/* ===== v0.5 디자인 테마 (설정 › 디자인 테마 · html[data-skin]) =====
   1 clean  클린 라이트 (삼쩜삼·토스)   2 night 나이트 (알라미)
   3 fresh  프레시 그린 (네이버페이)    4 sport 스포츠 다크 (플랜핏)
   5 soft   소프트 파스텔 (로고 분위기) */
html[data-skin]{--rad:16px;--rad-s:12px}
html[data-skin] body{font-family:"Pretendard Variable",Pretendard,var(--body);letter-spacing:-.01em}
html[data-skin] .hd h1,html[data-skin] h2{font-family:"Pretendard Variable",Pretendard,var(--display);font-weight:800;letter-spacing:-.02em}
html[data-skin] .card,html[data-skin] .panel,html[data-skin] .todo,html[data-skin] .stile,html[data-skin] .quest,html[data-skin] .supply,html[data-skin] .sbox,html[data-skin] .wxcard{border-radius:var(--rad)}
html[data-skin] .act,html[data-skin] .sbtn,html[data-skin] .save,html[data-skin] .qbtn{border-radius:var(--rad-s)}
html[data-skin] .sec-t{font-size:15px;color:var(--ink);font-weight:800}

/* 1. 클린 라이트: 연회색 바탕 · 흰 카드 · 테두리 없음 · 파랑 강조 */
html[data-skin="clean"]{--bg:#F2F4F6;--surface:#FFFFFF;--ink:#191F28;--muted:#6B7684;--line:#E5E8EB;--accent:#3182F6;--accent-soft:#E8F3FF;--amber:#F59E0B;--amber-soft:#FEF3DC;--red:#F04452;--red-soft:#FDECEE;--blue:#3182F6;--blue-soft:#E8F3FF;--grid:#EEF0F2;--good:#15A35C;--c-a:#3182F6;--c-b:#F2771B;color-scheme:light}
html[data-skin="clean"] header.hd{background:var(--bg);border-bottom:0}
html[data-skin="clean"] .card,html[data-skin="clean"] .panel,html[data-skin="clean"] .todo,html[data-skin="clean"] .stile,html[data-skin="clean"] .sbox,html[data-skin="clean"] .quest,html[data-skin="clean"] .qbtn{border-color:transparent}
html[data-skin="clean"] .chip{background:#fff;border-color:transparent}html[data-skin="clean"] .chip.on{background:#191F28;border-color:#191F28;color:#fff}
html[data-skin="clean"] nav.tabs{border-top:0;box-shadow:0 -1px 0 #E5E8EB}

/* 2. 나이트: 짙은 남색 · 보라/청록 강조 · 큰 둥근 카드 */
html[data-skin="night"]{--bg:#0B0E1A;--surface:#161A2C;--ink:#ECEEFB;--muted:#9097B8;--line:#262B45;--accent:#7C6CF2;--accent-soft:#25214A;--amber:#F6B84B;--amber-soft:#3A2E17;--red:#FF6B7A;--red-soft:#3D1D26;--blue:#4FC3F7;--blue-soft:#15283A;--grid:#22263D;--good:#3DDC97;--c-a:#7C6CF2;--c-b:#4FC3F7;--scrim:rgba(0,0,0,.65);color-scheme:dark;--rad:22px;--rad-s:14px}
html[data-skin="night"] header.hd{background:var(--bg);border-bottom:0}
html[data-skin="night"] .card,html[data-skin="night"] .panel,html[data-skin="night"] .todo,html[data-skin="night"] .stile,html[data-skin="night"] .sbox,html[data-skin="night"] .quest{border-color:transparent;background:linear-gradient(180deg,#1A1F36,#151929)}
html[data-skin="night"] .chip.on,html[data-skin="night"] .act.pri,html[data-skin="night"] .save{background:linear-gradient(90deg,#7C6CF2,#5B8CFF);border-color:transparent;color:#fff}

/* 3. 프레시 그린: 흰 바탕 · 초록 강조 · 진하게 채운 칩 · 얇은 구분선 */
html[data-skin="fresh"]{--bg:#FFFFFF;--surface:#FFFFFF;--ink:#1E1E23;--muted:#767680;--line:#ECECEF;--accent:#03C75A;--accent-soft:#E6F9EE;--amber:#FF9F1C;--amber-soft:#FFF3E0;--red:#FF4D4F;--red-soft:#FFEDED;--blue:#2F80ED;--blue-soft:#EAF2FE;--grid:#F2F2F4;--good:#03C75A;--c-a:#03C75A;--c-b:#5B5FEF;color-scheme:light}

html[data-skin="fresh"] header.hd{border-bottom-color:transparent}

/* 4. 스포츠 다크: 검정 · 민트 · 굵고 큰 글씨 */
html[data-skin="sport"]{--bg:#000000;--surface:#17181A;--ink:#FFFFFF;--muted:#8E9196;--line:#2A2C30;--accent:#2EE6C5;--accent-soft:#0E2E29;--amber:#FFC145;--amber-soft:#33280F;--red:#FF5C5C;--red-soft:#361515;--blue:#5AB0FF;--blue-soft:#132535;--grid:#222326;--good:#2EE6C5;--c-a:#2EE6C5;--c-b:#FF8A3D;--scrim:rgba(0,0,0,.7);color-scheme:dark;--rad:18px;--rad-s:12px}
html[data-skin="sport"] header.hd{background:#000;border-bottom:0}

html[data-skin="sport"] .chip{background:#1F2023;border-color:transparent;color:#ddd}html[data-skin="sport"] .chip.on,html[data-skin="sport"] .act.pri,html[data-skin="sport"] .save{background:var(--accent);border-color:var(--accent);color:#00201A}

html[data-skin="soft"]{--bg:#FBF6EF;--surface:#FFFDF9;--ink:#3B2A1E;--muted:#8A7564;--line:#EFE4D6;--accent:#E07A8F;--accent-soft:#FCE9EC;--amber:#D99A3A;--amber-soft:#FBF0DC;--red:#D9534F;--red-soft:#FBE6E4;--blue:#5B8DB8;--blue-soft:#E6EFF7;--grid:#F2E9DD;--good:#6BAA75;--c-a:#5B8DB8;--c-b:#E07A8F;color-scheme:light;--rad:24px;--rad-s:16px}

/* 공통: 홈 퀘스트 게이지 */
.qgauge{display:grid;grid-template-columns:132px 1fr;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--rad,14px);padding:12px 16px}
.qgauge svg{width:132px;height:auto}.qgauge .qg-n{font:800 30px/1 var(--display);fill:var(--ink)}.qgauge .qg-s{font-size:10px;fill:var(--muted)}
.qgauge h3{margin:0 0 4px;font-size:17px}.qgauge p{margin:0;color:var(--muted);font-size:13.5px}.qgauge b.big{font-size:22px;color:var(--accent)}
/* 입력 아이콘 스타일 */
.ic.icirc,.ic.icut,.ic.iline,.ic.iduo,.ic.iglyph{background:transparent;padding:0;overflow:visible}
.qgrid .qbtn.qx{padding:14px 4px 10px;gap:8px}
.qgrid .qbtn.qx .ic{width:52px;height:52px}
.ic.icirc{border-radius:50%;overflow:hidden;background:var(--accent-soft)}.ic.icirc img{width:100%;height:100%;object-fit:cover;transform:scale(1.12)}
.ic.icut img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.qgrid .qbtn.qx .ic.icut{width:62px;height:62px}
.ic.iline svg{width:62%;height:62%;color:var(--accent);stroke-width:1.7}.ic.iline{border-radius:16px;background:var(--accent-soft);display:grid;place-items:center}
.ic.iduo{position:relative;display:grid;place-items:center}.ic.iduo svg{position:absolute;width:70%;height:70%;color:var(--accent)}.ic.iduo svg.u{color:color-mix(in srgb,var(--accent) 28%,transparent);stroke-width:6}.ic.iduo{background:var(--accent-soft);border-radius:50%}
.ic.iglyph{border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--g) 78%,#fff),var(--g));box-shadow:0 3px 8px color-mix(in srgb,var(--g) 30%,transparent)}.ic.iglyph svg{width:58%;height:58%;color:#fff}
.qbtn.qx .cnt{top:-8px;right:-8px;min-width:28px;height:28px;padding:0 7px;border-radius:14px;display:grid;place-items:center;background:var(--red);color:#fff;font:800 20px/1 var(--mono);box-shadow:0 2px 5px rgba(0,0,0,.25);border:2px solid var(--surface);z-index:2}
.qbtn.qx .cnt:empty{display:none}.qbtn.qx.zero .cnt{background:var(--blue)}.qbtn.qx.miss .cnt{color:#fff}
.ic.ipoly{background:transparent;padding:0}.ic.ipoly svg{width:100%;height:100%;display:block}.qgrid .qbtn.qx .ic.ipoly{width:64px;height:64px}
/* ===== PC 화면: 더 넓게 (min-width 규칙 → build.py가 PC 설정으로도 켬) ===== */
.hd .pcbtn{margin-left:auto;font-size:18px;width:38px;height:34px;border:1px solid var(--line);border-radius:999px;display:grid;place-items:center;background:var(--surface)}
@media (min-width:1024px){:where(html:not([data-pc="off"])) .sowtiles{grid-template-columns:repeat(6,minmax(0,1fr))}
:where(html:not([data-pc="off"])) .qgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
:where(html:not([data-pc="off"])) .homegrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
:where(html:not([data-pc="off"])) main{max-width:1440px}
:where(html:not([data-pc="off"])) .scrim{align-items:center;padding:32px}
:where(html:not([data-pc="off"])) .sheet{border-radius:18px;max-height:88%;max-width:680px}
:where(html:not([data-pc="off"])) .sheet.wide{max-width:900px}
:where(html:not([data-pc="off"])) .qbtn:hover,:where(html:not([data-pc="off"])) .stile:hover,:where(html:not([data-pc="off"])) .todo:hover,:where(html:not([data-pc="off"])) .chip:hover{filter:brightness(.97)}}
:where(html[data-pc="on"]) .sowtiles{grid-template-columns:repeat(6,minmax(0,1fr))}
:where(html[data-pc="on"]) .qgrid{grid-template-columns:repeat(6,minmax(0,1fr))}
:where(html[data-pc="on"]) .homegrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
:where(html[data-pc="on"]) main{max-width:1440px}
:where(html[data-pc="on"]) .scrim{align-items:center;padding:32px}
:where(html[data-pc="on"]) .sheet{border-radius:18px;max-height:88%;max-width:680px}
:where(html[data-pc="on"]) .sheet.wide{max-width:900px}
:where(html[data-pc="on"]) .qbtn:hover,:where(html[data-pc="on"]) .stile:hover,:where(html[data-pc="on"]) .todo:hover,:where(html[data-pc="on"]) .chip:hover{filter:brightness(.97)}

/* 할 일 목록: PC에서 한 줄 2개 */
.todolist{display:grid;gap:8px}
@media (min-width:1024px){:where(html:not([data-pc="off"])) .todolist{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
:where(html:not([data-pc="off"])) .todolist .todo{margin:0}}
:where(html[data-pc="on"]) .todolist{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
:where(html[data-pc="on"]) .todolist .todo{margin:0}

</style>

  list.sort((a,b)=>pr(a)-pr(b)||b.i.d-a.i.d||a.s.id.localeCompare(b.s.id));
  const targetN=state.sows.filter(s=>!culledRec(s.id)&&(doneIds.has(s.id)||F.sow.filter(statusOf(s),I.date))).length;
  return {list,targetN,doneN:doneIds.size};
}
function doSave(force){
  const I=ui.in,F=FORMS[I.type];I.err=null;
  const d={...I.fv};F.f.forEach(f=>{if(f.t==="step")d[f.k]=Number(d[f.k])||0;if(f.t==="text")d[f.k]=String(d[f.k]||"").trim()});
  if(F.err){const e=F.err(d);if(e&&!I.editId){I.err=e;render();return}}
  const sows=F.sow?I.sel:[null];
  EXCL=I.editId;
  if(!force&&F.warn){const ws=sows.map(s=>F.warn(d,I.date,s)).filter(Boolean);if(ws.length){I.warn=ws;EXCL=null;render();return}}
  const ids=[];let msg="";
  sows.forEach(s=>{
    const dd={...d};if(F.pre)F.pre(dd,I.date,s);
    const data={};F.f.forEach(f=>{if(f.t!=="calc"&&dd[f.k]!==undefined&&dd[f.k]!=="")data[f.k]=dd[f.k]});
    if(I.type==="이유")data.days=dd.days;
    if(dd.prod)data.prod=dd.prod;
    if(s)data.sow=s;
    if(I.type==="도입"){data.sow=data.sowid;delete data.sowid;}
    if(I.editId){const r=state.records.find(x=>x.id===I.editId);if(r){if(r.data.decision)data.decision=r.data.decision;r.workDate=I.date;r.data=data;r.edited=true;r.editedAt=new Date().toISOString();r.editedBy=state.user;ids.push(r.id)}}
    else{
      if(I.type==="임신확인"&&data.result==="임신"){const sw=state.sows.find(x=>x.id===s);if(sw&&sw.gilt&&!sowState(s).pregEver)msg+=` · ${s} 모돈 편입`}
      const rec=addRecord(I.type,I.date,data);ids.push(rec.id);
      if(I.type==="도입")state.sows.push({id:data.sow,baseParity:0,loc:SOW_LOCS[0],gilt:true,breed:data.breed,intro:I.date});
    }
  });
  if(I.type==="이유"&&!I.editId){let tot=0;sows.forEach(s=>{tot+=+d.n||0});
    if(d._to&&d._to!=="그대로"&&tot){const r=addRecord("이동",I.date,{from:"분만사",to:d._to,n:tot});ids.push(r.id);msg+=` · 자돈 ${tot}두 → ${d._to}`}
    if(d._loc&&d._loc!=="그대로")sows.forEach(s=>{const sw=state.sows.find(x=>x.id===s);if(sw&&sw.loc!==d._loc){const r=addRecord("이동",I.date,{sow:s,from:sw.loc,to:d._loc});ids.push(r.id);ui.undoLoc=ui.undoLoc||{};ui.undoLoc[s]=sw.loc;sw.loc=d._loc}});
    if(d._loc&&d._loc!=="그대로")msg+=` · 모돈 → ${d._loc}`}
  EXCL=null;save();
  const n=ids.length;
  let m=I.editId?"수정했습니다":`${L(I.type)} ${n>1?n+"두 ":""}저장했습니다`;
  if(!I.editId&&I.type==="교배")m+=` · 재발 확인 ${kDate(addDays(I.date,21))}, 분만 예정 ${kDate(addDays(I.date,CFG.gest))}`;
  if(I.date<TODAY)m+=" (지연 입력)";
  m+=msg;
  I.flash=ids;I.warn=null;
  if(F.sow){I.sel=[];}
  if(I.editId){I.editId=null;I.fv=defaults(I.type)}
  else{ // 연속 입력: 선택값은 유지, 숫자는 기본값으로
    F.f.forEach(f=>{if(f.t==="step"&&!["kg"].includes(f.k))I.fv[f.k]=f.def;if((f.t==="text"||f.t==="textarea"||f.t==="date")&&f.k!=="kind")I.fv[f.k]="";});
    if(I.type==="폐사")ui.dec=null;
  }
  render();if(I.editId)toast(m);else undoToast(m,ids);
  const el=document.getElementById("r-"+ids[0]);if(el&&window.innerWidth<720)el.scrollIntoView({block:"center",behavior:"smooth"});
  setTimeout(()=>{if(ui.in){ui.in.flash=[];document.querySelectorAll(".srow.flash").forEach(e=>e.classList.remove("flash"))}},4000);
}

function isoWeek(s){const t=new Date(toUTC(s));const d=(t.getUTCDay()+6)%7;const th=new Date(t.getTime()+(3-d)*864e5);const y=th.getUTCFullYear();const j=Date.UTC(y,0,1);return {y,w:1+Math.floor((th.getTime()-j)/(7*864e5))}}
function weekStart(s){const t=new Date(toUTC(s));const wd=(t.getUTCDay()+6)%7;return addDays(s,-wd)}
function bName(k){const i=isoWeek(k),c=isoWeek(TODAY);return `${i.y!==c.y?String(i.y).slice(2)+"-":""}W${i.w} 돈군`}
function bAgo(k){const n=Math.round(diff(k,weekStart(TODAY))/7);return n<=0?t("이번 주"):n+(LANG==="ko"?"":" ")+t("주 전")}
const shipAge=()=>state.cfg.stage.reduce((s,x)=>s+x[1],0);
const bAge=b=>Math.floor(diff(b.k,REF)/7);
function stagePlan(ageW){let a=0;for(const [n,w] of state.cfg.stage){a+=w;if(ageW<a)return n}return "출하"}
function bHeads(b,ageW){let n=b.live,a=ageW;state.cfg.stage.forEach(([nm,len],i)=>{if(a<=0)return;n*=1-LOSS[i]*Math.min(a,len)/len;a-=len});return Math.round(n)}
function bVax(b,p){const due=addDays(b.k,p.day),need=bHeads(b,Math.floor(p.day/7)),recs=recsOf("돈군백신").filter(r=>r.data.batch===b.k&&r.data.vax===p.name),done=recs.reduce((s,r)=>s+r.data.n,0);
  const over=REF>addDays(due,6);
  const st=done>=need*.98?"done":done>0?(over?"part":"partnow"):over?"late":REF>=due?"due":diff(REF,due)<=7?"soon":"plan";
  return {p,due,need,done,recs,st}}
const liveBatches=()=>batches().filter(b=>bAge(b)>=0&&bAge(b)<shipAge()&&(!state.batchCut||b.k>=state.batchCut));

function delta(r){if(r.type==="_침")return -r.data.n;if(r.type==="재고")return r.data.mode==="입고"?r.data.qty:r.data.mode==="사용"?-r.data.qty:0;if(r.type==="돈군백신")return -r.data.n;if(r.type==="약품")return -(r.data.qty||1);return -1}
function semenOrder(){
  const tmr=addDays(TODAY,1);let n=0;
  activeSows().forEach(s=>{const i=statusOf(s);if(i.stage==="이유"){const d=diff(i.since,tmr);if(d>=4&&d<=7)n++}else if(i.stage==="재교배")n++});
  n+=reguMateTomorrow();   // 레규 동기화 그룹: 정시 교배 첫날 전날, 그 그룹 두수도 더함(84)

  return {n,doses,stock,order:Math.max(0,doses-stock)};
}

  const far=asc.filter(r=>r.type==="분만"),s=state.sows.find(x=>x.id===id);
  return far.map((f,n)=>{const nextF=far[n+1];
    const m=[...asc].reverse().find(r=>r.type==="교배"&&r.data.round==="1차"&&r.workDate<f.workDate&&diff(r.workDate,f.workDate)<=125);
    const w=asc.find(r=>r.type==="이유"&&r.workDate>f.workDate&&(!nextF||r.workDate<nextF.workDate));
    const nm=w?asc.find(r=>r.type==="교배"&&r.workDate>w.workDate&&(!nextF||r.workDate<nextF.workDate)):null;
    return {parity:s.baseParity+n+1,m,f,w,nm}});
}

const feedBag=f=>FARM.feed.bags.find(b=>b.feed===f);
const feedBin=f=>FARM.feed.bins.find(b=>b.feed===f);
function pigFeeds(day){return FARM.feed.piglet.filter(p=>day>=p.from&&day<p.to)}
// 지금 하루 사용량(kg) 추정
function feedUse(){const u={},U=FARM.feed.use,add=(f,n)=>u[f]=(u[f]||0)+n;
  activeSows().forEach(s=>{const i=statusOf(s);add(i.stage==="포유"?"포유모돈":"임신모돈",i.stage==="포유"?U.포유모돈:U.임신모돈)});
  liveBatches().forEach(b=>{const d=diff(b.k,REF),n=bHeads(b,Math.floor(d/7));pigFeeds(d).forEach(p=>add(p.feed,n*(U[p.feed]||0)))});
  return u}
// 재고 = 마지막 잔량 + 이후 입고 − 추정 사용
function feedStock(f,use){const rs=recsOf("사료").filter(r=>r.data.kind===f).sort((a,b)=>a.workDate.localeCompare(b.workDate));
  const base=[...rs].reverse().find(r=>r.data.mode==="빈 잔량"||r.data.mode==="잔량");if(!base)return {kg:null,use,days:null};
  const inn=rs.filter(r=>r.data.mode==="입고"&&r.workDate>base.workDate&&r.workDate<=REF).reduce((s,r)=>s+r.data.kg,0);
  const kg=Math.max(0,Math.round(base.data.kg+inn-use*diff(base.workDate,REF)));
  return {kg,use,days:use>0?Math.floor(kg/use):null,since:base.workDate}}
function feedTable(){const u=feedUse();return feedKinds().map(f=>({f,bin:feedBin(f),bag:feedBag(f),...feedStock(f,u[f]||0)}))}
function feedTodos(){
  const T=feedTable(),ord=REF!==TODAY?[]:feedOrderToday().map(o=>{const x=T.find(r=>r.f===o.f)||{f:o.f,days:null};return {feed:x,label:`${o.bin?o.bin.name:t("포대")} · ${o.bin?o.qty.toLocaleString()+"kg":o.qtyBags+t("포")} · ${t("도착")} ${kDate(o.arrive)}${o.weekend?" · "+t("주말 전 주문"):""}`,sev:o.short||o.weekend?"bad":"warn"}});
  const chg=[];liveBatches().forEach(b=>{const d=diff(b.k,REF);FARM.feed.piglet.forEach(p=>{if(d<p.from||d>p.from+2)return;
    const key=`${b.k}|${p.feed}`,lg=tdLog(tdKey("feedchg",key));if(lg&&localDateOf(lg.at)!==TODAY)return;
    chg.push({fc:{key,b,p},label:`${d}일령 · ${p.feed}${p.note?" · "+p.note:""}`,sev:d>p.from+1?"bad":"warn"})})});
  return [{k:"feedord",t:"사료 주문",items:ord,act:null},{k:"feedchg",t:"사료 변경 (돈군 일령)",items:chg,act:null}]}
function vFeedPanel(){
  const rows=feedTable();
  return `<div class="sec-t">${t("사료 재고")} <span>${t("추정")}</span></div><div class="panel"><div class="dtbl"><table><thead><tr><th>${t("사료")}</th><th>${t("위치")}</th><th>${t("남은 양")}</th><th>${t("하루")}</th><th>${t("남은 일수")}</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.f)}</b></td><td>${x.bin?esc(x.bin.name):t("포대")}</td><td>${x.kg===null?"—":x.kg.toLocaleString()+"kg"+(x.bag?` · ${Math.floor(x.kg/x.bag.kg)}${t("포")}`:"")}</td><td>${Math.round(x.use)}kg</td><td style="color:${x.days===null?"var(--muted)":x.days<=2?"var(--red)":x.days<=FARM.feed.orderDays?"var(--amber)":"var(--ink)"};font-weight:700">${x.days===null?(x.use?t("잔량 기록 필요"):"—"):x.days+t("일")}</td></tr>`).join("")}</tbody></table></div><div class="note">${t("남은 양 = 마지막 잔량 + 이후 입고 − 두수×하루 급여량. 빈 잔량(포대 수)을 가끔 입력하면 정확해집니다.")}</div></div>`}
/* ================= v0.4 · 날씨 (Open-Meteo · 키 없이 무료) ================= */
let WX=null,wxAt=0;
try{const c=JSON.parse(localStorage.getItem("farm-wx")||"null");if(c){WX=c.d;wxAt=c.at}}catch(e){}
const WX_EVERY=10*60e3;   // 날씨 새로 받는 간격 (10분)
function wxLoad(){if(Date.now()-wxAt<WX_EVERY)return;wxAt=Date.now();
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${FARM.lat}&longitude=${FARM.lon}&current=temperature_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max,weather_code&timezone=Asia%2FSeoul&forecast_days=2`)
    .then(r=>r.json()).then(d=>{WX=d;try{localStorage.setItem("farm-wx",JSON.stringify({d,at:wxAt}))}catch(e){}render()}).catch(()=>{})}
const WXC=c=>c===0?"맑음":c<=3?"구름":c<=48?"안개":c<=67?"비":c<=77?"눈":c<=82?"소나기":c<=86?"눈":"뇌우";
function wxDay(i){const d=WX&&WX.daily;return d?{max:Math.round(d.temperature_2m_max[i]),min:Math.round(d.temperature_2m_min[i]),wind:Math.round(d.wind_speed_10m_max[i]),code:d.weather_code[i]}:null}
function wxLine(){wxLoad();if(!WX||!WX.current)return `<div class="bd-wx">${FARM.place} · ${t("날씨 불러오는 중")}</div>`;
  const c=WX.current,d=wxDay(0);return `<div class="bd-wx">${FARM.place} ${t(WXC(c.weather_code))} <b>${Math.round(c.temperature_2m)}℃</b> · ${d.min}~${d.max}℃ · ${t("바람")} ${Math.round(c.wind_speed_10m/3.6)}m/s</div>`}
// 홈 맨 위 날씨 한 줄 (+ 경고)
// 홈: 경고가 있는 날만 카드
function wxHome(){wxLoad();const al=wxAlerts(0).replace(/bd-al wx/g,"wxal");return al?`<div class="wxcard">${al}</div>`:""}
// 상단 주차 옆 짧은 날씨
function wxShort(){wxLoad();if(!WX||!WX.current)return "";const c=WX.current,d=wxDay(0);return ` · ${t(WXC(c.weather_code))} ${Math.round(c.temperature_2m)}℃ (${d.min}~${d.max}℃)`}
function wxAlerts(day){const d=wxDay(day||0),n=wxDay((day||0)+1),W=FARM.wx;if(!d)return "";const a=[];
  if(d.max>=W.hot)a.push(`${t("폭염")} ${d.max}℃ · ${t("환기·급수·쿨링 점검")}`);
  else if(n&&n.max>=W.hot)a.push(`${t("내일 폭염")} ${n.max}℃ · ${t("오늘 쿨링·급수 미리 점검")}`);
  if(n&&n.min<=W.cold&&d.min>W.cold)a.push(`${t("내일 영하 진입")} ${n.min}℃ · ${t("급수관 동파·보온 미리 점검")}`);
  if(d.min<=W.freeze)a.push(`${t("한파")} ${d.min}℃ · ${t("급수 확인·보온")}`);
  if(d.wind>=W.wind)a.push(`${t("강풍")} ${Math.round(d.wind/3.6)}m/s · ${t("커튼·문·지붕 점검")}`);
  return a.map(x=>`<div class="bd-al wx">${x}</div>`).join("")}
// 화면을 켜 두기만 해도 10분마다 새로 받기 (받으면 render)
setInterval(()=>{if(me())wxLoad()},60e3);
/* ===== 사료 계획: 주수별 섭취량 → 8주 필요량 → 빈마다 주문일·주문량·구매 주기 =====
   모돈 주기: 임신 115 → 포유 28 → 공태 5 (148일). 임신 중 모돈은 분만 예정일에 새 돈군(최근 평균 실산) 생김 */
const FP_H=56,FP_CYC=148;
// 안전 재고·도착·신선도 일수: 대표 설정(state.feedOpt)이 있으면 그 값
["orderDays","leadDays","freshDays","arriveBuf","orderCut","truckCap","truckMin","bagMin","bagAim","bagMax","bagFresh"].forEach(k=>{const d=FARM.feed[k];Object.defineProperty(FARM.feed,k,{get(){const v=(state.feedOpt||{})[k];return v!=null?v:d},configurable:true})});
function fIntake(){const I=FARM.feed.intake,o=state.intake||{};return {...I,...o,pig:I.pig.map((v,i)=>o.pig&&o.pig[i]!=null?o.pig[i]:v),lact:I.lact.map((v,i)=>o.lact&&o.lact[i]!=null?o.lact[i]:v)}}
function sowAnchor(s){const st=sowState(s.id),i=statusOf(s);if(i.key==="도태됨")return null;
  if(st.stage==="포유")return {pos0:115,at:st.farrow};
  if(st.stage==="이유")return {pos0:143,at:st.since};
  if((st.stage==="임신"||st.stage==="교배")&&st.mate)return {pos0:0,at:st.mate};
  return {gilt:st.stage==="후보",open:true}}
// 임신·공태·후보는 임신돈 급여 기준(47g gCfg)을 따름
function sowNeed(a,day,I){const C=gCfg();if(a.open)return a.gilt?C.gilt:C.flush;const p=((a.pos0+diff(a.at,day))%FP_CYC+FP_CYC)%FP_CYC;
  if(p<115){const ph=C.phases.find(x=>p<=x.to)||C.phases[C.phases.length-1];return [ph.kg,"임신모돈"]}if(p<143)return [I.lact[Math.min(3,Math.floor((p-115)/7))],"포유모돈"];return [C.flush,"임신모돈"]}
function avgLive(){const m=rangeMetrics(addDays(TODAY,-180),TODAY);return m&&okv(m.live)?m.live:11}
// 날짜별 사료 종류별 필요량 {feed:kg}
let FPD={};
function feedPlanDays(H=FP_H,S0=TODAY){const ck=[H,S0,state.records.length,state.sows.length,JSON.stringify(state.intake||{}),JSON.stringify(state.mbatches||[])].join("|");if(FPD.k===ck)return FPD.v;FPD={k:ck,v:feedPlanDays0(H,S0)};return FPD.v}
function feedPlanDays0(H,S0){const I=fIntake(),days=[],sows=activeSows().map(s=>[s,sowAnchor(s)]).filter(x=>x[1]);
  const bs=batches().map(b=>({k:b.k,b})),lv=avgLive(),born={};
  sows.forEach(([s,a])=>{if(a.open||a.pos0!==0)return;const F=addDays(a.at,115);if(F>=S0&&diff(S0,F)<=H){const k=weekStart(F);born[k]=(born[k]||0)+lv}});
  Object.entries(born).forEach(([k,n])=>{const ex=bs.find(x=>x.k===k);if(ex)ex.extra=n;else bs.push({k,b:{k,live:0,f:[]},extra:n})});
  for(let i=0;i<H;i++){const d=addDays(S0,i),u={},add=(f,n)=>{if(n>0)u[f]=(u[f]||0)+n};
    sows.forEach(([s,a])=>{const r=sowNeed(a,d,I);if(Array.isArray(r))add(r[1],r[0]);else add("임신모돈",r)});
    bs.forEach(({k,b,extra})=>{const age=diff(k,d);if(age<0||age>=shipAge()*7)return;const w=Math.floor(age/7),n=bHeads({...b,live:(b.live||0)+(extra||0)},w),kg=I.pig[Math.min(I.pig.length-1,w)]||0,fs=pigFeeds(age);fs.forEach(p=>add(p.feed,n*kg/fs.length))});
    days.push({d,u})}
  return days}
// 오늘 하루 사용량 (기존 feedUse 대체 · 남은 일수 계산에 씀)
function feedUse(){return REF===TODAY?feedPlanDays()[0].u:feedPlanDays(1,REF)[0].u}
// ---- 배송 달력 ----
const dow=d=>new Date(toUTC(d)).getUTCDay();   // 0 = 일요일
const feedHoli=()=>state.feedHoli||[];
const noDeliv=d=>dow(d)===0||feedHoli().includes(d);
const canOrder=d=>dow(d)!==0&&!feedHoli().includes(d);
// d에 주문하면 도착하는 날. pm = 오전 주문 시각이 지남 → 다음 날 오전 주문과 같음
function arriveOf(d,pm){let o=d;if(pm){o=addDays(o,1);while(!canOrder(o))o=addDays(o,1)}let a=addDays(o,1);while(noDeliv(a))a=addDays(a,1);return a}
// 사료마다: 주문 마감일(도착 아침까지 안 떨어지는 가장 늦은 주문일) · 도착일 · 권장량
function feedPlan(){const D=feedPlanDays(),F=feedKinds(),buf=FARM.feed.arriveBuf,pmNow=nowHM()>=FARM.feed.orderCut;
  return F.map(f=>{const need=D.map(x=>x.u[f]||0),bin=feedBin(f),bag=feedBag(f),st=feedStock(f,need[0]),wk=[0,1,2,3,4,5,6,7].map(w=>need.slice(w*7,w*7+7).reduce((a,b)=>a+b,0)),avg4=wk.slice(0,4).reduce((a,b)=>a+b,0)/28;
    const o={f,bin,bag,kg:st.kg,need,wk,avg4,d0:need[0]};if(st.kg==null||avg4<=0)return o;
    const morn=k=>st.kg-need.slice(0,k).reduce((a,b)=>a+b,0);   // k일 뒤 아침 잔량
    let by=null,arr=null;for(let k=0;k<need.length-3;k++){const d=addDays(TODAY,k);if(!canOrder(d))continue;const a=arriveOf(d,k===0&&pmNow),j=diff(TODAY,a);if(morn(j)>=buf*avg4){by=d;arr=a}else break}
    if(!by){by=TODAY;let d=TODAY;while(!canOrder(d))d=addDays(d,1);arr=arriveOf(d,d===TODAY&&pmNow);o.short=Math.max(0,diff(TODAY,arr)-Math.floor(st.kg/avg4))}   // 지금 주문해도 늦음
    o.orderBy=by;o.arrive=arr;o.orderOn=by;o.weekend=[5,6].includes(dow(by))||diff(by,arr)>1;const atArr=Math.max(0,morn(diff(TODAY,arr)));o.atArr=atArr;
    if(bin){const fresh=FARM.feed.freshDays,hold=Math.min(bin.cap,fresh*avg4);o.qty=Math.max(500,Math.floor((hold-atArr)/500)*500);o.cycle=Math.max(1,Math.round(o.qty/avg4));o.full=Math.round(bin.cap/avg4);o.small=o.full<4;o.limit=bin.cap<fresh*avg4?"cap":"fresh"}
    if(bag){o.bagsWk=Math.ceil(avg4*7/bag.kg);o.qtyBags=Math.max(1,Math.ceil((avg4*7-atArr)/bag.kg))}
    return o})}
// ---- 벌크 이송차 계획: 빈 여러 개를 한 차(탱크 10t)로. 가장 급한 빈의 주문 마감일에 차를 부르고, 급한 빈부터 채울 수 있는 만큼(빈 용량·신선도) 싣는다 ----
function bulkTrucks(P){const B=P.filter(o=>o.bin&&o.kg!=null&&o.avg4>0);if(!B.length)return [];const H=B[0].need.length,buf=FARM.feed.arriveBuf,pmNow=nowHM()>=FARM.feed.orderCut,cap=FARM.feed.truckCap,fresh=FARM.feed.freshDays;
  const add=B.map(()=>Array(H+1).fill(0)),morn=(bi,k)=>{const o=B[bi];let s2=o.kg;for(let x=0;x<k;x++)s2+=add[bi][x]-o.need[x];return s2+add[bi][k]*0};
  const stockAt=(bi,k)=>{const o=B[bi];let s2=o.kg;for(let x=0;x<k&&x<H;x++)s2+=add[bi][x]-o.need[x];return s2+(k<H?add[bi][k]:0)};   // k일 아침(그날 도착분 포함)
  let lastJ=-1;const deadline=(bi,from)=>{let by=null;for(let k=from;k<H-3;k++){const d=addDays(TODAY,k);if(!canOrder(d))continue;const a=arriveOf(d,k===0&&pmNow),j=diff(TODAY,a);if(j>=H)break;if(j<=lastJ)continue;if(stockAt(bi,j)-add[bi][j]>=buf*B[bi].avg4)by=k;else break}return by};
  const T=[];let from=0;
  for(let n=0;n<8;n++){const dl=B.map((o,bi)=>({bi,k:deadline(bi,from)}));const cand=dl.filter(x=>x.k!=null);
    const late=dl.filter(x=>x.k==null);const k0=late.length?from:cand.length?Math.min(...cand.map(x=>x.k)):null;if(k0==null)break;
    let od=addDays(TODAY,k0);while(!canOrder(od))od=addDays(od,1);const ar=arriveOf(od,od===TODAY&&pmNow),j=diff(TODAY,ar);if(j>=H)break;
    const order=[...dl].sort((x,y)=>(x.k??-1)-(y.k??-1));let left=cap;const items=[];
    order.forEach(({bi})=>{const o=B[bi],s2=Math.max(0,stockAt(bi,j)),room=Math.floor((Math.min(o.bin.cap,fresh*o.avg4)-s2)/500)*500,q=Math.min(room,Math.floor(left/500)*500);if(q>=500){items.push({o,q,atArr:Math.round(s2)});add[bi][j]+=q;left-=q}});
    const tot=cap-left;if(!items.length)break;lastJ=j;T.push({order:od,arrive:ar,items,tot,under:tot<FARM.feed.truckMin,weekend:[5,6].includes(dow(od))||diff(od,ar)>1,short:late.length?late.map(x=>B[x.bi].f):null});
    from=diff(TODAY,od)+1}
  return T}
// ---- 포대 주문: 4종을 한 번에. 가장 급한 포대 마감일에, 합계 최소~최대 포(목표 포)로 · 사료마다 신선도 상한 ----
function bagOrders(P){const G=P.filter(o=>o.bag&&o.kg!=null&&o.avg4>0);if(!G.length)return [];const H=G[0].need.length,F=FARM.feed,buf=F.arriveBuf,pmNow=nowHM()>=F.orderCut;
  const add=G.map(()=>Array(H+1).fill(0)),stock=(gi,k)=>{const o=G[gi];let s2=o.kg;for(let x=0;x<k&&x<H;x++)s2+=add[gi][x]-o.need[x];return s2};   // k일 아침, 그날 도착 전
  const O=[];let from=0,lastJ=-1;
  for(let n=0;n<4;n++){const dl=G.map((o,gi)=>{let by=null;for(let k=from;k<H-3;k++){const d=addDays(TODAY,k);if(!canOrder(d))continue;const j=diff(TODAY,arriveOf(d,k===0&&pmNow));if(j>=H)break;if(j<=lastJ)continue;if(stock(gi,j)>=buf*o.avg4)by=k;else break}return by});
    const late=dl.some(k=>k==null),k0=late?from:Math.min(...dl);if(k0==null||!isFinite(k0))break;let od=addDays(TODAY,k0);while(!canOrder(od))od=addDays(od,1);const ar=arriveOf(od,od===TODAY&&pmNow),j=diff(TODAY,ar);if(j>=H)break;
    // 기본: 도착 후 14일 필요 − 도착 때 남은 양 · 그다음 합계가 최소에 못 미치면 쓰는 양 비례로 늘림(사료마다 bagFresh일분 상한)
    const fut=(gi,days)=>G[gi].need.slice(j,j+days).reduce((a,b)=>a+b,0)||G[gi].avg4*days;
    let q=G.map((o,gi)=>Math.max(0,Math.ceil((fut(gi,14)-Math.max(0,stock(gi,j)))/o.bag.kg))),cap=G.map((o,gi)=>Math.max(0,Math.floor((fut(gi,F.bagFresh)-Math.max(0,stock(gi,j)))/o.bag.kg)));
    q=q.map((v,i)=>Math.min(v,Math.max(cap[i],v)));let tot=q.reduce((a,b)=>a+b,0);
    for(let g=0;tot<F.bagAim&&g<200;g++){const i=G.map((o,gi)=>({gi,r:(q[gi]*o.bag.kg+Math.max(0,stock(gi,j)))/(o.avg4||1)})).filter(x=>q[x.gi]<cap[x.gi]).sort((a,b)=>a.r-b.r)[0];if(!i)break;q[i.gi]++;tot++}
    // 신선도 상한까지 채워도 최소 포 수에 못 미치면, 최소량이 우선(사료회사 조건) → 많이 쓰는 사료에 더 얹음
    let over=false;for(let g=0;tot<F.bagMin&&g<300;g++){const i=G.map((o,gi)=>({gi,r:(q[gi]*o.bag.kg+Math.max(0,stock(gi,j)))/(o.avg4||1)})).sort((a,b)=>a.r-b.r)[0];q[i.gi]++;tot++;over=true}

  const rd=R.filter(r=>(r.data.mode==="빈 잔량"||r.data.mode==="잔량")&&r.data.kg!=null&&r.workDate>=from),out=[];

  else if((st.stage==="교배"||st.stage==="임신")&&st.mate){gd=diff(st.mate,d);const p=C.phases.find(x=>gd<=x.to)||C.phases[C.phases.length-1];base=p.kg;phase=p.l}
  else return null;

  const tp=barnTemp(s.loc,d);if(tp!=null&&tp<C.lct){const add=kg*C.tempPct*(C.lct-tp);kg+=add;why.push(`${tp}℃ +${add.toFixed(1)}`)}

  const gilt=!!s.gilt&&!st.pregEver;
  if(c)return {...st,parity,gilt:false,key:"도태됨",label:t("도태됨"),sub:`${kDate(c.workDate)} · ${c.data.reason}`,cls:"x",heat:false,d:0};

  else if(st.stage==="임신"){d=diff(st.mate,REF);const left=CFG.gest-d;
    if(left<=CFG.farrowIn){key="분만임박";label=t("분만 임박");sub=left>0?`${t("분만")} D−${left}`:left===0?t("오늘 분만 예정"):`${t("분만")} +${-left}${t("일 지남")}`;cls="c-due"}
    else{key="임신";label=t("임신");sub=`${t("임신")} ${d}${t("일")}`;cls="c-preg"}}
  else if(st.stage==="포유"){d=diff(st.farrow,REF);key="포유";label=t(s.nurse?"대리모":"포유");sub=s.nurse?`${t("대리모")} ${diff(s.nurse.since,REF)}${t("일")}`:`${t("포유")} ${d}${t("일")} · ${t("실산")} ${st.live}${st.foster?` (${t("양자")} ${st.foster>0?"+":""}${st.foster})`:""}`;cls="c-lac";
    if(s.weanHold&&s.weanHold.until>=REF)sub+=` · ${t("이유 보류")} ~${kDate(s.weanHold.until)}`}

}
function summary(r){const d=r.data;switch(r.type){

  case "폐사":return `${d.barn} ${t(d.stage)} ${t("폐사")} ${d.n}${t("두")} · ${t(d.cause)}${d.sow?` · ${d.sow}${t("의 복")}`:""}`;
  case "교배":return `${d.sow} ${t("교배")} (${t(d.round)}) · ${d.semen}`;

  case "분만":return `${d.sow} ${t("분만")} · ${t("실산")} ${d.live} / ${t("사산")} ${d.still} / ${t("미라")} ${d.mum}${d.ease&&d.ease!=="정상"?` · ${t(d.ease)}`:""}${d.oxy==="씀"?` · ${t("옥시토신")}`:""}${d.start?` · ${d.start}`:""}`;
  case "이유":return `${d.sow} ${t("이유")} ${d.n}${t("두")} · ${d.days}${t("일")}`;
  case "백신":return `${d.sow} ${t(d.kind)} · ${d.name}${d.memo?` · ${d.memo}`:""}`;
  case "양자":return `${t("양자")} ${d.sow} → ${d.to} ${d.n}${t("두")}`;

  case "이동":return d.sow?`${d.sow} ${d.from} → ${d.to}`:`${d.from} → ${d.to} ${d.n}${t("두")}`;

  case "약품":return `${t(d.kind)} · ${d.barn} · ${d.name}${d.qty?` ${d.qty}${(state.items.find(i=>i.name===d.name)||{}).unit||""}`:""}${d.withdraw?` · ~${kDate(d.withdraw)}`:""}`;

  case "재고":{const it=itemById(d.item)||{name:"?",unit:""};return `${it.name} ${t(d.mode)} ${d.qty}${it.unit}${d.memo?` · ${d.memo}`:""}`}
}return ""}

function deadPending(){
  const C=state.cfg,out=[];
  const recs=recsOf("폐사").filter(r=>diff(r.workDate,TODAY)<=7);
  recs.forEach(r=>{if(r.data.n>=C.deadOne&&!r.data.decision)out.push({r,pending:true,label:`${kDate(r.workDate)} · ${summary(r)}`,sev:"bad"})});
  const g={};recs.forEach(r=>{const k=r.workDate+"|"+r.data.barn;(g[k]=g[k]||[]).push(r)});
  Object.entries(g).forEach(([k,rs])=>{const day=dayGroup(k,rs);if(day.pending)out.push({day,pending:true,label:`${kDate(day.date)} · ${day.barn} ${t("하루 합계")} ${day.total}${t("두")} (${rs.length}${t("건")})`,sev:"bad"})});
  return out;
}
function dayGroup(k,rs){
  const C=state.cfg,[date,...b]=k.split("|"),barn=b.join("|"),total=rs.reduce((s,r)=>s+r.data.n,0);
  const bigOpen=rs.some(r=>r.data.n>=C.deadOne&&!r.data.decision);
  const dd=(state.dayDec||{})[k];
  const covered=Math.max(dd?dd.total:0,rs.filter(r=>r.data.n>=C.deadOne&&r.data.decision).reduce((s,r)=>s+r.data.n,0));
  return {k,date,barn,total,cnt:rs.length,rs,dd,pending:total>=C.deadDay&&!bigOpen&&total>covered};
}

function batches(){const g={};recsOf("분만").slice().forEach(f=>{const k=weekStart(f.workDate);(g[k]=g[k]||{k,f:[]}).f.push(f)});
  const out=Object.values(g).map(b=>({...b,live:b.f.reduce((s,f)=>s+f.data.live,0)}));
  (state.mbatches||[]).forEach(m=>{const live=Math.round(m.n/survF(m.age));const ex=out.find(b=>b.k===m.k);if(ex){ex.live=live;ex.fixed=m.n}else out.push({k:m.k,f:[],live,manual:true,litters:m.litters||0,n0:m.n})});
  return out.sort((a,b)=>b.k.localeCompare(a.k))}
function stockOf(it){
  const rs=stockRecs(it).sort((a,b)=>a.workDate.localeCompare(b.workDate)||a.createdAt.localeCompare(b.createdAt));
  if(!rs.some(r=>r.type==="재고"))return {qty:null,avg:0,days:null};
  let q=0,used=0;const from=addDays(TODAY,-27);
  rs.forEach(r=>{if(r.type==="재고"&&r.data.mode==="실사"){q=r.data.qty;return}const d=delta(r);q+=d;if(d<0&&r.workDate>=from)used-=d});
  const avg=used/28;return {qty:Math.round(q*10)/10,avg,days:avg>0?Math.floor(q/avg):null};
}
const stockSt=(it,s)=>s.qty===null?"none":s.qty<it.par?"bad":s.qty<it.par*1.3?"warn":"ok";

const amDay=d=>((state.am=state.am||{})[d]=state.am[d]||{});
function amProg(d=TODAY){const D=(state.am||{})[d]||{};return {done:FARM.morning.route.filter(r=>D[r.barn]).length,all:FARM.morning.route.length}}
const nowHM=()=>{const n=new Date();return pad(n.getHours())+":"+pad(n.getMinutes())};
function amTodos(){if(REF!==TODAY)return [];const D=amDay(TODAY),late=nowHM()>=FARM.morning.due;
  const left=FARM.morning.route.filter(r=>!D[r.barn]).map(r=>({am:r,label:`${FARM.morning.due}${t("까지")}`,sev:late?"bad":"ok"}));
  const bad=FARM.morning.route.filter(r=>D[r.barn]&&amIssues(r,D[r.barn]).length).map(r=>({am:r,label:amIssues(r,D[r.barn]).join(" · "),sev:"warn",issue:true}));
  return [{k:"am",t:"아침 점검",items:[...left,...bad],act:null}]}
function waterAvg(barn){const v=[];for(let i=1;i<=7;i++){const x=((state.am||{})[addDays(TODAY,-i)]||{})[barn];if(x&&x.water)v.push(+x.water)}return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function amIssues(r,x){const a=[...(x.bad||[]).map(b=>t(b)+" "+t("이상"))];const wa=waterAvg(r.barn);if(x.water&&wa&&+x.water<wa*.8)a.push(`${t("급수량")} ↓ ${Math.round((1-x.water/wa)*100)}%`);if(x.temp!==""&&x.temp!=null&&r.temp){if(+x.temp<r.temp[0])a.push(`${x.temp}℃ ${t("낮음")}`);else if(+x.temp>r.temp[1])a.push(`${x.temp}℃ ${t("높음")}`)}return a}

  FARM.morning.route.forEach((r,n)=>{const x=D[r.barn],O=ui.am&&ui.am.barn===r.barn?ui.am:null,iss=x?amIssues(r,x):[];

        <div class="f"><span class="lb">${t("이상 있는 항목만 누르기")}</span><div class="chipwrap">${its.map(i=>`<button type="button" class="chip wrap ${O.bad.includes(i)?"on bad":""}" data-a="amBad" data-v="${esc(i)}">${O.bad.includes(i)?"✕ ":"✓ "}${esc(t(i))}</button>`).join("")}</div></div>
        <div class="f"><label for="amMemo">${t("메모 (선택)")}</label><input type="text" id="amMemo" value="${esc(O.memo)}" placeholder="${t("예: 3번 급수기 막힘 → 교체")}"></div>

    else if(x)h+=`<div class="sow-meta">${x.time} · ${x.temp!==""?x.temp+"℃ · ":""}${esc(x.user)}${x.memo?" · "+esc(x.memo):""}</div><div class="sow-meta" style="font-weight:700;color:${iss.length?"var(--red)":"var(--accent)"}">${iss.length?iss.join(" · "):t("이상 없음")}</div><div class="acts"><button class="act" type="button" data-a="amOpen" data-v="${esc(r.barn)}">${t("고치기")}</button></div>`;

    let col=cur.u.indexOf(Math.min(...cur.u));if(cur.u[col]+h>H+1&&cur.it.length){cur={u:Array(cols).fill(0),it:[]};P.push(cur);col=0}

  const par=el.parentElement,cw=el.clientWidth,sw=el.scrollWidth,pw=par?par.clientWidth:cw,over=Math.max(sw-cw,el.offsetWidth-pw);if(over<=2||cw<12)return;

function bundleKey(k,it){
  if(k==="svax")return it.vx?it.vx.name.replace(/\s*\d+차.*$/,""):"1";   // 백신 종류별
  if(k==="bvax")return it.v&&it.v.p?it.v.p.name.replace(/\s*\d+차.*$/,""):"1";   // 돈군 백신 종류별(1차·2차는 같은 일)
  if(k==="lit")return it.name||"1";                           // 1일·3일 처치별
  if(k==="annual")return it.ann?it.ann.name:"1";
  if(k==="feedord")return it.feed&&it.feed.bin?"bulk":"bag";  // 벌크 / 포대
  if(k==="feedchg")return it.fc?it.fc.p.feed:"1";
  if(k==="task")return (it.t&&(it.t.barn||it.t.title))||"1";  // 돈사별 조치
  if(k==="closemiss")return it.cm?it.cm.day:"1";              // 날짜별
  return "1"}                                                // 나머지는 묶음 하나

/* ================= v0.6 · 초기 등록 (본서버 첫 실제 자료) =================

const SU_F=[["m1","교배일","date"],["s1","웅돈","semen"],["r1","재발일","date"],["m2","재발 후 교배일","date"],["s2","웅돈 (재교배)","semen"],["r2","두 번째 재발일","date"],
  ["f","분만일","date"],["tot","총산자수","num"],["still","사산 (카드에 없으면 건너뛰기)","num"],["nurse","포유개시두수","num"],["w","이유일","date"],["wn","이유두수","num"],["note","특이사항","note"]];

const suMD=v=>v&&v.length===4?`${+v.slice(0,2)}/${+v.slice(2)}`:"";
// 연도 붙이기: 카드 날짜를 산차·칸 순서대로 놓고, 마지막 날짜가 오늘(분만예정 등 미래는 +150일까지)을 넘지 않게 뒤에서부터 연도를 정함
function suDates(c){const L=[];Object.keys(c.cols).map(Number).sort((a,b)=>a-b).forEach(p=>{const o=c.cols[p];["m1","r1","m2","r2","f","w"].forEach(k=>{if(o[k]&&/^\d{4}$/.test(o[k]))L.push({p,k,md:o[k]})})});
  let nx=null;const lim=addDays(TODAY,0);for(let i=L.length-1;i>=0;i--){const mm=+L[i].md.slice(0,2),dd=+L[i].md.slice(2);let y=+TODAY.slice(0,4)+1,d;
    do{y--;d=`${y}-${pad(mm)}-${pad(dd)}`}while(d>(nx||lim));L[i].d=d;nx=d}
  const m={};L.forEach(x=>m[x.p+"|"+x.k]=x.d);return m}
function suBad(c){const D=suDates(c),w=[];Object.keys(c.cols).map(Number).sort((a,b)=>a-b).forEach(p=>{const o=c.cols[p],g=k=>D[p+"|"+k];
  if(o.m1&&!/^\d{4}$/.test(o.m1)||o.f&&!/^\d{4}$/.test(o.f))w.push(`${p}${t("산")} ${t("날짜는 네 자리")}`);
  const mt=g("m2")||g("m1");if(mt&&g("f")){const gd=diff(mt,g("f"));if(gd<108||gd>122)w.push(`${p}${t("산")} ${t("임신")} ${gd}${t("일")}?`)}
  if(g("f")&&g("w")){const ld=diff(g("f"),g("w"));if(ld<14||ld>45)w.push(`${p}${t("산")} ${t("포유")} ${ld}${t("일")}?`)}
  if(o.tot!=null&&o.nurse!=null&&+o.nurse>+o.tot+4)w.push(`${p}${t("산")} ${t("포유개시가 총산보다 많음")}`);
  if(o.wn!=null&&o.nurse!=null&&+o.wn>+o.nurse)w.push(`${p}${t("산")} ${t("이유두수가 포유개시보다 많음")}`);
  const n=Number(o.still||0);if(o.tot!=null&&n>+o.tot)w.push(`${p}${t("산")} ${t("사산이 총산보다 많음")}`);

const KEEP_T=["교배","임신확인","분만","이유","양자","도태","도입","BCS","동기화","레규급여"];
const keepAlways=r=>KEEP_T.includes(r.type)||!!(r.data&&r.data.sow);
const arcCut=()=>addDays(TODAY,-365);
// 빼도 되는 것만 뺌: 서버에 이미 있는 그대로(보낼 목록에 없고, 마지막으로 주고받은 내용과 같음)인 오래된 매일 기록. 스냅숏에서도 지워 '삭제'로 보내지 않음
function syPrune(){if(!syOn()||!SY.token||SY.join||SY.replace||!SY.snap)return 0;const cut=arcCut(),S=SY.snap.rec;let n=0;
  state.records=state.records.filter(r=>{if(r._old||keepAlways(r)||!(r.workDate<cut)||SY.out["rec|"+r.id]||S[r.id]!==fnv(JSON.stringify(r)))return true;delete S[r.id];n++;return false});
  if(n){sySave();SYNC_MUTE=true;save();SYNC_MUTE=false}return n}
const _syPull93=syPull;syPull=function(){return _syPull93.apply(this,arguments).then(r=>{try{if(syPrune()&&tab!=="input")render()}catch(e){}return r})};
// ---- 예전 기간 보기(보기 전용): 서버에서 받아 성적·타임라인·그래프에 보여 주고, 휴대폰·서버에는 저장 안 함(다시 열면 사라짐) ----
let OLDV=null;
async function oldLoad(f,t2){const r=await syCall({a:"range",token:SY.token,farm:syFarm(),f,t:t2});if(!r.ok)throw new Error(r.err);
  const have=new Set(state.records.map(x=>x.id)),add=r.recs.filter(x=>!have.has(x.id)).map(x=>({...x,_old:1}));
  oldClear();state.records.push(...add);OLDV={f,t:t2,n:add.length};return add.length}
function oldClear(){if(state.records.some(r=>r._old))state.records=state.records.filter(r=>!r._old);OLDV=null}
Object.assign(A,{
  oldOpen:()=>{const m=TODAY.slice(0,7),y=addDays(TODAY,-730).slice(0,7);$("#sheetRoot").innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet"><div class="sh-hd"><h2>${t("예전 기록 보기")}</h2></div>
    <p class="sow-meta">${t("휴대폰에는 최근 12개월 매일 기록만 있습니다. 고른 기간을 서버에서 받아 성적·타임라인에 보여 줍니다. 보기 전용이며 앱을 다시 열면 사라집니다.")}</p>
    <div class="setrow"><span>${t("시작 달")}</span><input id="oldF" type="month" value="${y}"></div><div class="setrow"><span>${t("끝 달")}</span><input id="oldT" type="month" value="${addDays(TODAY,-366).slice(0,7)}"></div>
    <button class="act pri" type="button" data-a="oldGo">${t("불러오기")}</button></div></div>`},
  oldGo:async()=>{const f=($("#oldF").value||"")+"-01",m=$("#oldT").value||"";if(!m||f<"2000")return;const [y,mo]=m.split("-").map(Number),t2=m+"-"+String(new Date(Date.UTC(y,mo,0)).getUTCDate()).padStart(2,"0");
    toast(t("불러오는 중…"));try{const n=await oldLoad(f,t2);$("#sheetRoot").innerHTML="";toast(`${n}${t("건 불러옴")}`);render()}catch(e){toast(t("불러오지 못했습니다(인터넷·서버 연결 확인)"))}},
  oldOff:()=>{oldClear();render()}});
function oldBar(){if(!syOn()||!SY.token)return "";return OLDV?`<div class="banner info"><b>📂</b><span>${OLDV.f.slice(0,7)} ~ ${OLDV.t.slice(0,7)} ${t("예전 기록")} ${OLDV.n}${t("건 보는 중 · 보기 전용")}</span><button class="act" type="button" data-a="oldOff">${t("닫기")}</button></div>`
  :`<div style="text-align:right;margin:0 0 6px"><button class="act" type="button" data-a="oldOpen">📂 ${t("예전 기록 보기")}</button></div>`}
const _vStats93=vStats;vStats=function(){return oldBar()+_vStats93.apply(this,arguments)};
const _vTimeline93=vTimeline;vTimeline=function(){return oldBar()+_vTimeline93.apply(this,arguments)};
// 보기 전용 기록은 고치기·지우기 막음
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-a]");if(!b||!OLDV)return;const id=b.dataset.v,r=id&&state.records.find(x=>x.id===id&&x._old);
  if(r&&/edit|del|Del|Edit/.test(b.dataset.a)){e.stopImmediatePropagation();e.preventDefault();toast(t("예전 기록은 보기 전용입니다"))}},true);
// ---- 서버에 연결된 휴대폰의 '데이터 초기화': 이 휴대폰만 서버에서 다시 받기 · 대표만 '서버 새로 시작'(지우지 않고 보관 시트로)·'되돌리기' — 계정·PIN 은 그대로 ----
let ARC=null;
function syAfterSwap(msg){SY.out={};SY.replace=true;SY.cursor=0;sySave();return syPull(true).then(()=>{toast(msg);render()})}
const _vReset93=vReset;vReset=function(){if(!(syOn()&&SY.token))return _vReset93.apply(this,arguments);
  let h=`<h2>${t("데이터 초기화")}</h2><div class="panel"><b>${t("이 휴대폰만 다시 받기")}</b><div class="sow-meta">${t("이 휴대폰의 기록을 비우고 서버 기록으로 다시 받습니다. 서버와 다른 휴대폰은 그대로입니다.")}</div><button class="act" type="button" data-a="syReDown">${t("다시 받기")}</button></div>`;
  if(can("admin")){if(!ARC){ARC={list:[]};syCall({a:"archives",token:SY.token,farm:syFarm()}).then(r=>{if(r.ok){ARC.list=r.list;render()}}).catch(()=>{})}
    h+=`<div class="sec-t">${t("서버 새로 시작 (대표)")}</div><div class="panel"><div class="sow-meta">${t("서버의 이 농장 기록을 지우지 않고 보관 시트로 옮긴 뒤 빈 상태로 시작합니다. 드라이브 백업을 먼저 만들고, 계정·PIN 은 그대로입니다. 아래 '되돌리기'로 언제든 원래대로 돌릴 수 있습니다.")}</div>
    <div class="setrow"><span>${t("확인: 농장 이름 입력")} <b>${esc(FARM.name||"")}</b></span><input id="frYes" type="text" placeholder="${esc(FARM.name||"")}" autocomplete="off"></div><button class="act bad" type="button" data-a="srvFresh">${t("서버 새로 시작")}</button></div>
    <div class="sec-t">${t("이전 기록으로 되돌리기 (대표)")}</div><div class="panel">${ARC.list.length?ARC.list.slice().reverse().map(n=>`<div class="setrow"><span>${esc(n.replace("보관 "+syFarm()+" ",""))} ${t("까지의 기록")}</span><button class="act" type="button" data-a="srvBack" data-v="${esc(n)}">${t("되돌리기")}</button></div>`).join(""):`<div class="sow-meta">${t("보관된 기록이 없습니다")}</div>`}</div>`}
  return h};
Object.assign(A,{
  // 못 보낸 기록이 있으면 먼저 보내고, 남아 있으면 멈춤(지우지 않음)
  syReDown:async()=>{if(!confirm(t("이 휴대폰 기록을 비우고 서버에서 다시 받을까요?")))return;await syFlush();if(syPending()){toast(t("아직 못 보낸 기록이 있습니다. 인터넷 연결 뒤 다시 하세요"));return}await syAfterSwap(t("다시 받았습니다"))},
  resetDo:(f=>v=>{if(syOn()&&SY.token){toast(t("서버 연결 중에는 이 휴대폰만 다시 받을 수 있습니다"));return}f(v)})(A.resetDo),
  srvFresh:async()=>{const y=($("#frYes").value||"").trim();if(y!==(FARM.name||"")){toast(t("농장 이름이 맞지 않습니다"));return}
    if(!confirm(t("서버의 지금 기록을 보관 시트로 옮기고 빈 상태로 시작할까요? (되돌리기 가능)")))return;
    toast(t("백업하고 옮기는 중…"));try{const r=await syCall({a:"fresh",token:SY.token,farm:syFarm(),yes:syFarm()});if(!r.ok)throw new Error(r.err);ARC=null;await syAfterSwap(t("서버를 새로 시작했습니다"))}catch(e){toast(t("실패")+": "+e.message)}},
  srvBack:async v=>{if(!confirm(t("이 보관 기록으로 되돌릴까요? 지금 기록은 다시 보관됩니다(지워지지 않음).")))return;
    toast(t("백업하고 되돌리는 중…"));try{const r=await syCall({a:"rollback",token:SY.token,farm:syFarm(),name:v});if(!r.ok)throw new Error(r.err);ARC=null;await syAfterSwap(t("되돌렸습니다"))}catch(e){toast(t("실패")+": "+e.message)}}});
/* ================= 입장 키 (링크를 받은 사람만) ================= */
const GATE="cbfad02f9ed2a8d1e08d8f74f5303e9eb93637d47f82ab6f1c15871cf8dd0481";
async function sha(x){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x));return [...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
async function gateOK(raw){
  try{if(localStorage.getItem("farm-gate")===GATE)return true}catch(e){}
  const src=raw!==undefined?raw:location.hash,m=String(src).match(/key=([A-Za-z0-9]+)/)||(raw!==undefined?String(raw).trim().match(/^([A-Za-z0-9]{4,})$/):null);
  if(m&&await sha(m[1])===GATE){try{localStorage.setItem("farm-gate",GATE)}catch(e){}if(location.hash)history.replaceState(null,"",location.pathname+location.search);return true}
  return false;
}
function renderGate(err){document.body.classList.add("login");
  $("#view").innerHTML=`<div class="login-box"><div class="login-brand"><img src="../logo.png" alt="비담농장" class="login-logo"></div><div class="panel"><b>농장에서 받은 링크로만 열 수 있습니다.</b><div class="sow-meta">대표님께 받은 링크를 다시 눌러 주세요. 또는 대표님께 받은 입장 키를 아래에 입력하세요.</div><input type="text" id="gateIn" placeholder="입장 키 또는 받은 링크" inputmode="numeric" aria-label="받은 링크 또는 입장 키">${err?`<div class="errbox">입장 키가 맞지 않습니다.</div>`:""}<button class="save" type="button" id="gateBtn">열기</button></div></div>`;
  $("#gateBtn").onclick=async()=>{if(await gateOK($("#gateIn").value)){render()}else renderGate(true)}}

/* ================= 시작 ================= */
state=load();
if(!state||state.v!==7){makeState("farm")}
try{ME=localStorage.getItem(SKEY)}catch(e){}
{const ad=(state.accounts||[]).find(a=>a.id==="a1");if(ad&&ad.pin==="0000"){ad.pin="9368";save()}}
// 새로 생긴 재고 품목(주사침 등) 채우기
{const have=new Set(state.items.map(x=>x.name));let n=state.items.length;FARM.items.forEach(([name,cat,unit,par,withdraw])=>{if(!have.has(name))state.items.push({id:"i"+(++n)+"x",name,cat,unit,par,withdraw})})}
syncLists();
state.cfgSt=state.cfgSt||{...CFG.st};state.tasks=state.tasks||[];state.todoLog=state.todoLog||{};
gateOK().then(ok=>ok?render():renderGate());
window.addEventListener("hashchange",()=>{if(/key=/.test(location.hash))gateOK().then(ok=>ok?render():renderGate(true))});
</script>
